<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Directory Browser</title>
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #e9ecef;
      --hover-bg: #f1f3f5;
      --accent-color: #0d6efd;
      --folder-color: #ffc107;
      --file-color: #6c757d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .header {
      padding: 20px;
      background-color: #fff;
      border-bottom: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      font-size: 0.95rem;
      color: var(--accent-color);
    }

    .breadcrumb span {
      cursor: pointer;
    }

    .breadcrumb span:hover {
      text-decoration: underline;
    }

    .breadcrumb .separator {
      color: var(--file-color);
      cursor: default;
    }

    .list-header, .item {
      display: grid;
      grid-template-columns: 30px 1fr 100px 180px;
      padding: 12px 20px;
      align-items: center;
    }

    .list-header {
      font-weight: bold;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
      text-transform: uppercase;
      color: var(--file-color);
    }

    .item-list {
      list-style: none;
    }

    .item {
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      transition: background-color 0.15s ease;
      text-decoration: none;
      color: inherit;
    }

    .item:last-child {
      border-bottom: none;
    }

    .item:hover {
      background-color: var(--hover-bg);
    }

    .icon {
      font-weight: bold;
    }

    .icon.folder { color: var(--folder-color); }
    .icon.file { color: var(--file-color); }

    .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .size, .modified {
      font-size: 0.85rem;
      color: var(--file-color);
    }

    .empty-state, .loading-state, .error-state {
      padding: 40px;
      text-align: center;
      color: var(--file-color);
    }

    .error-state {
      color: #dc3545;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Directory Browser</h1>
    <div class="breadcrumb" id="breadcrumb">
      <!-- Breadcrumbs injected dynamically -->
    </div>
  </div>

  <div class="list-header">
    <span></span>
    <span>Name</span>
    <span>Size</span>
    <span>Last Modified</span>
  </div>

  <div id="content">
    <div class="loading-state">Loading directory contents...</div>
  </div>
</div>

<script>
  // API endpoint for fetching directory contents
  const API_URL = '/api/files'; 

  let currentPath = '';

  // Fetch directory data from server
  async function loadDirectory(path = '') {
    const contentDiv = document.getElementById('content');
    contentDiv.innerHTML = '<div class="loading-state">Loading directory contents...</div>';
    
    try {
      // Send path as a query parameter
      const response = await fetch(`${API_URL}?path=${encodeURIComponent(path)}`);
      
      if (!response.ok) {
        throw new Error(`Server returned status ${response.status}`);
      }

      const data = await response.json();
      currentPath = path;
      
      renderBreadcrumbs(currentPath);
      renderList(data);
    } catch (error) {
      contentDiv.innerHTML = `<div class="error-state">Failed to load directory: ${error.message}</div>`;
    }
  }

  // Render Breadcrumb navigation
  function renderBreadcrumbs(path) {
    const breadcrumbContainer = document.getElementById('breadcrumb');
    breadcrumbContainer.innerHTML = '';

    const rootSpan = document.createElement('span');
    rootSpan.textContent = 'Root';
    rootSpan.onclick = () => loadDirectory('');
    breadcrumbContainer.appendChild(rootSpan);

    if (!path) return;

    const parts = path.split('/').filter(p => p.length > 0);
    let accumulatedPath = '';

    parts.forEach((part) => {
      accumulatedPath += '/' + part;
      const targetPath = accumulatedPath;

      const separator = document.createElement('span');
      separator.className = 'separator';
      separator.textContent = ' / ';
      breadcrumbContainer.appendChild(separator);

      const itemSpan = document.createElement('span');
      itemSpan.textContent = part;
      itemSpan.onclick = () => loadDirectory(targetPath);
      breadcrumbContainer.appendChild(itemSpan);
    });
  }

  // Render File and Directory List
  function renderList(items) {
    const contentDiv = document.getElementById('content');

    if (!items || items.length === 0) {
      contentDiv.innerHTML = '<div class="empty-state">This directory is empty.</div>';
      return;
    }

    const list = document.createElement('ul');
    list.className = 'item-list';

    // Sort folders first, then files alphabetically
    items.sort((a, b) => {
      if (a.isDirectory === b.isDirectory) {
        return a.name.localeCompare(b.name);
      }
      return a.isDirectory ? -1 : 1;
    });

    items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'item';

      const iconClass = item.isDirectory ? 'folder' : 'file';
      const iconSymbol = item.isDirectory ? '📁' : '📄';

      li.innerHTML = `
        <span class="icon ${iconClass}">${iconSymbol}</span>
        <span class="name">${escapeHtml(item.name)}</span>
        <span class="size">${item.isDirectory ? '-' : formatBytes(item.size)}</span>
        <span class="modified">${item.modified ? formatDate(item.modified) : '-'}</span>
      `;

      li.onclick = () => {
        if (item.isDirectory) {
          const newPath = currentPath ? `${currentPath}/${item.name}` : item.name;
          loadDirectory(newPath);
        } else {
          // Trigger file download/view
          const downloadUrl = `/api/download?path=${encodeURIComponent(currentPath ? `${currentPath}/${item.name}` : item.name)}`;
          window.open(downloadUrl, '_blank');
        }
      };

      list.appendChild(li);
    });

    contentDiv.innerHTML = '';
    contentDiv.appendChild(list);
  }

  // Helper: Format File Sizes
  function formatBytes(bytes, decimals = 1) {
    if (!bytes || bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(decimals)) + ' ' + sizes[i];
  }

  // Helper: Format Date
  function formatDate(dateStr) {
    const date = new Date(dateStr);
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Helper: Prevent XSS
  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/"/g, "&quot;")
              .replace(/'/g, "&#039;");
  }

  // Initial Load
  document.addEventListener('DOMContentLoaded', () => loadDirectory(''));
</script>

</body>
</html>
