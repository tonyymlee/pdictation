<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PDF merge — 圖片合併與文件掃描工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    (function () {
      const savedTheme = localStorage.getItem('pdfmerge_theme');
      const isDark = savedTheme !== 'light';
      document.documentElement.classList.toggle('dark', isDark);
      const meta = document.getElementById('themeColorMeta');
      if (meta) meta.setAttribute('content', isDark ? '#0f172a' : '#4f46e5');
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    .sortable-ghost {
      opacity: 0.35;
      transform: scale(0.97);
    }
    .sortable-chosen {
      box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.25), 0 8px 10px -6px rgba(79, 70, 229, 0.2);
      border-color: #6366f1 !important;
      z-index: 20;
    }
    .sortable-drag {
      opacity: 0.95;
    }

    .drag-over {
      border-color: #6366f1 !important;
      background-color: #eef2ff !important;
    }
    .dark .drag-over {
      border-color: #818cf8 !important;
      background-color: rgba(79, 70, 229, 0.15) !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }

    @keyframes shutterFlash {
      0% { opacity: 0.75; }
      100% { opacity: 0; }
    }
    .animate-shutter-flash {
      animation: shutterFlash 0.22s ease-out forwards;
    }

    @keyframes focusPulse {
      0% { transform: translate(-50%, -50%) scale(1.35); opacity: 1; }
      60% { transform: translate(-50%, -50%) scale(0.96); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
    }
    .animate-focus-ring {
      animation: focusPulse 0.9s ease-out forwards;
    }

    .touch-btn {
      min-height: 36px;
      touch-action: manipulation;
    }

    .drag-handle {
      touch-action: none;
    }

    #cropCanvas {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">

  <!-- 頂部導覽列 -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 transition-colors">
    <div class="max-w-6xl mx-auto px-3.5 sm:px-6 h-14 sm:h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-6 4h4" />
          </svg>
        </div>
        <div class="truncate">
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900 dark:text-white leading-none truncate">PDF merge</h1>
          <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">圖片轉 PDF 與文件掃描工具</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <!-- 深淺色模式切換按鈕 -->
        <button id="themeToggleBtn" type="button" aria-label="切換深色或淺色模式" title="切換模式" class="touch-btn w-10 h-10 sm:w-auto sm:px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 inline-flex items-center justify-center gap-1.5 transition-colors">
          <svg class="w-4 h-4 text-amber-400 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg class="w-4 h-4 text-indigo-600 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <span id="themeToggleText" class="hidden sm:inline text-xs font-semibold">淺色模式</span>
        </button>

        <button id="clearAllBtn" type="button" class="hidden touch-btn px-3 py-2 text-xs sm:text-sm font-medium text-rose-600 dark:text-rose-400 bg-rose-50 hover:bg-rose-100 active:bg-rose-200 dark:bg-rose-950/50 dark:hover:bg-rose-900/60 rounded-xl transition-colors">
          全部清除
        </button>

        <button id="headerConvertBtn" type="button" disabled class="hidden sm:inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 dark:disabled:bg-slate-800 dark:disabled:text-slate-500 disabled:cursor-not-allowed rounded-xl shadow-sm transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>建立 PDF</span>
          <span id="headerCountBadge" class="hidden bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容 -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-3 sm:px-6 pt-3 sm:pt-6 pb-28 lg:pb-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 lg:gap-8 items-start">

      <!-- 左欄：上傳、精簡設定與頁面排列區 -->
      <div class="lg:col-span-8 space-y-4">

        <!-- 精簡上傳與掃描控制區 -->
        <div id="dropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-2xl p-3.5 sm:p-5 text-center transition-all hover:border-indigo-400 dark:hover:border-indigo-500 cursor-pointer">
          <input id="fileInput" type="file" accept="image/*" multiple class="hidden" />
          <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" />

          <h2 class="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100">加入或拍攝掃描文件</h2>

          <div class="mt-2.5 grid grid-cols-2 gap-2 max-w-md mx-auto">
            <button id="browseBtn" type="button" class="touch-btn inline-flex items-center justify-center gap-1.5 px-3 py-2 text-xs sm:text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-xl shadow-sm transition-colors">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span>選擇圖片</span>
            </button>

            <button id="cameraBtn" type="button" class="touch-btn inline-flex items-center justify-center gap-1.5 px-3 py-2 text-xs sm:text-sm font-semibold text-indigo-700 dark:text-indigo-300 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/70 border border-indigo-200 dark:border-indigo-800 rounded-xl transition-colors">
              <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>立即拍照掃描</span>
            </button>
          </div>

          <!-- 精簡控制列：Row 1（頁碼 + 裁切 + 黑白 + 方向 + 邊距 + 縮放 + 畫質），Row 2（亮度/銳利度/重設），Row 3（輸出檔案名稱） -->
          <div class="no-drop-click mt-3 pt-3 border-t border-slate-100 dark:border-slate-800 space-y-2 cursor-default">
            <!-- Row 1: 全部切換按鈕 -->
            <div class="flex flex-wrap items-center justify-center gap-1.5">
              <!-- 頁碼開關（固定右下角） -->
              <button id="pageNumberToggle" type="button" role="switch" aria-checked="true" title="點擊開關右下角頁碼" class="touch-btn inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl border border-emerald-500/60 bg-emerald-50 dark:bg-emerald-950/40 transition-all shrink-0">
                <span id="pageNumTrack" class="relative inline-flex h-4 w-7 shrink-0 items-center rounded-full bg-emerald-500 transition-colors duration-200">
                  <span id="pageNumKnob" class="inline-block h-3 w-3 transform rounded-full bg-white shadow transition-transform duration-200 translate-x-3.5"></span>
                </span>
                <span class="text-xs font-bold text-emerald-700 dark:text-emerald-300" id="pageNumLabel">頁碼</span>
              </button>

              <!-- 自動矩形裁切開關 -->
              <button id="autoCropToggle" type="button" role="switch" aria-checked="true" title="點擊開關自動矩形裁切" class="touch-btn inline-flex items-center gap-1.5 px-2.5 py-1 rounded-xl border border-emerald-500/60 bg-emerald-50 dark:bg-emerald-950/40 transition-all shrink-0">
                <span id="autoCropTrack" class="relative inline-flex h-4 w-7 shrink-0 items-center rounded-full bg-emerald-500 transition-colors duration-200">
                  <span id="autoCropKnob" class="inline-block h-3 w-3 transform rounded-full bg-white shadow transition-transform duration-200 translate-x-3.5"></span>
                </span>
                <span class="text-xs font-bold text-emerald-700 dark:text-emerald-300" id="autoCropLabel">裁切</span>
              </button>

              <!-- 色彩模式切換：預設黑白（點擊切換 黑白 / 原圖） -->
              <button id="cycleFilterBtn" type="button" title="點擊切換黑白或原圖" class="touch-btn px-2.5 py-1 rounded-xl border border-indigo-500 bg-indigo-600 text-white text-xs font-semibold shadow-xs transition-all shrink-0">
                黑白
              </button>

              <!-- 方向切換：直向 / 橫向 -->
              <button id="cycleOrientationBtn" type="button" title="點擊切換直向或橫向" class="touch-btn inline-flex items-center gap-1 px-2.5 py-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold transition-all shrink-0">
                <span id="cycleOrientationIcon" class="w-2.5 h-3.5 border-[1.5px] border-current rounded-[2px] inline-block"></span>
                <span id="cycleOrientationText">直向</span>
              </button>

              <!-- 邊距切換：窄邊距 / 標準 / 無邊距 -->
              <button id="cycleMarginBtn" type="button" title="點擊切換邊距（窄邊距 / 標準 / 無邊距）" class="touch-btn px-2.5 py-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold transition-all shrink-0">
                窄邊距
              </button>

              <!-- 縮放切換：(不裁切) / (填滿) -->
              <button id="cycleFitBtn" type="button" title="點擊切換圖片縮放（不裁切 / 填滿）" class="touch-btn px-2.5 py-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold transition-all shrink-0">
                (不裁切)
              </button>

              <!-- 畫質切換：高畫質 / 中畫質 / 原畫質 -->
              <button id="cycleQualityBtn" type="button" title="點擊切換圖片畫質（高畫質 / 中畫質 / 原畫質）" class="touch-btn px-2.5 py-1 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold transition-all shrink-0">
                高畫質
              </button>
            </div>

            <!-- Row 2: 單行亮度 + 銳利度 + 重設 -->
            <div class="p-2 sm:px-3 rounded-xl bg-slate-50 dark:bg-slate-950/70 border border-slate-200 dark:border-slate-800 flex flex-row items-center gap-2 sm:gap-3 text-left">
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between text-[10px] sm:text-[11px] mb-1 gap-1">
                  <label for="brightnessSlider" class="font-medium text-slate-700 dark:text-slate-300 truncate">亮度</label>
                  <span id="brightnessVal" class="font-bold text-indigo-600 dark:text-indigo-400 tabular-nums shrink-0">0</span>
                </div>
                <input id="brightnessSlider" type="range" min="-60" max="60" step="5" value="0" class="w-full accent-indigo-600 cursor-pointer h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg" />
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between text-[10px] sm:text-[11px] mb-1 gap-1">
                  <label for="sharpnessSlider" class="font-medium text-slate-700 dark:text-slate-300 truncate">銳利度</label>
                  <span id="sharpnessVal" class="font-bold text-indigo-600 dark:text-indigo-400 tabular-nums shrink-0">30%</span>
                </div>
                <input id="sharpnessSlider" type="range" min="0" max="100" step="5" value="30" class="w-full accent-indigo-600 cursor-pointer h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg" />
              </div>

              <button id="resetAdjustBtn" type="button" class="touch-btn min-h-[32px] px-2.5 py-1 rounded-lg bg-slate-200/70 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-[11px] sm:text-xs font-semibold text-indigo-600 dark:text-indigo-400 shrink-0 transition-colors">
                重設
              </button>
            </div>

            <!-- Row 3: 輸出檔案名稱（自動偵測首頁中/英文為 P4C_ / P4E_） -->
            <div class="max-w-md mx-auto text-left pt-0.5">
              <div class="flex items-center justify-between mb-1">
                <label for="pdfFilename" class="text-[11px] font-semibold text-slate-500 dark:text-slate-400">輸出檔案名稱</label>
                <span id="ocrDetectBadge" class="hidden text-[10px] font-semibold text-emerald-600 dark:text-emerald-400"></span>
              </div>
              <div class="relative flex items-center">
                <input id="pdfFilename" type="text" value="P4X_" placeholder="P4X_" class="touch-btn w-full pl-3 pr-11 py-1.5 text-sm border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
                <span class="absolute right-3 text-xs font-semibold text-slate-400 dark:text-slate-500">.pdf</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 頁面標題列 -->
        <div id="workspaceHeader" class="hidden flex flex-wrap items-center justify-between gap-2 pt-1">
          <div class="flex items-center gap-2">
            <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100">頁面列表（共 <span id="imageCount">0</span> 頁）</h3>
            <span class="text-xs text-slate-500 dark:text-slate-400 bg-slate-200/70 dark:bg-slate-800 px-2.5 py-1 rounded-full hidden sm:inline">按住右上角圖示可拖曳排序</span>
          </div>

          <div class="flex items-center gap-2 ml-auto">
            <button id="addMoreBtn" type="button" class="touch-btn px-3 py-1.5 text-xs sm:text-sm font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/70 rounded-xl inline-flex items-center gap-1.5 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              <span>新增圖片</span>
            </button>
          </div>
        </div>

        <!-- 圖片格線 -->
        <div id="imageGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3.5 sm:gap-4"></div>

        <!-- 空狀態提示 -->
        <div id="emptyStateHint" class="text-center py-5 text-slate-400 dark:text-slate-500 text-xs sm:text-sm">
          尚未加入任何圖片。請點擊上方的 <span class="font-medium text-slate-600 dark:text-slate-300">選擇圖片</span> 或 <span class="font-medium text-slate-600 dark:text-slate-300">立即拍照掃描</span>。
        </div>
      </div>

      <!-- 右欄：PDF 輸出與尺寸 -->
      <div id="settingsSection" class="lg:col-span-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-5 shadow-sm space-y-4 lg:sticky lg:top-24 transition-colors">
        <div class="border-b border-slate-100 dark:border-slate-800 pb-3">
          <h3 class="text-base font-bold text-slate-900 dark:text-white">PDF 輸出</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">選擇頁面尺寸並下載或分享。</p>
        </div>

        <!-- 頁面尺寸 -->
        <div>
          <label for="pageSize" class="block text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">頁面尺寸</label>
          <select id="pageSize" class="touch-btn w-full px-3.5 py-2 text-base sm:text-sm border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="a4" selected>A4（210 × 297 毫米）</option>
            <option value="letter">美國信紙（8.5 × 11 吋）</option>
            <option value="fit">配合每張圖片原始尺寸</option>
          </select>
        </div>

        <!-- 電腦版操作按鈕 -->
        <div class="hidden lg:block pt-1 space-y-2">
          <button id="convertBtn" type="button" disabled class="w-full py-3 px-4 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 dark:disabled:bg-slate-800 dark:disabled:text-slate-500 disabled:cursor-not-allowed rounded-xl shadow-sm flex items-center justify-center gap-2 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            <span id="convertBtnText">合併並下載 PDF</span>
          </button>

          <button id="desktopShareBtn" type="button" disabled class="w-full py-2.5 px-4 text-sm font-semibold text-indigo-700 dark:text-indigo-300 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/70 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl flex items-center justify-center gap-2 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

    // =========================================================================
    // 連續拍照相機引擎（自動對焦 + 點擊對焦 + 多鏡頭切換 + 補光燈 + 硬體靜態拍照）

    let liveStream = null;

    function stopLiveCameraStream() {
      if (liveVideoTrack && liveTorchOn) {
        try {
          liveVideoTrack.applyConstraints({ advanced: [{ torch: false }] });
        } catch (_) {}
      }
      liveTorchOn = false;
      liveTorchBtn.className = 'hidden touch-btn px-2.5 py-1 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold';
      liveManualFocusWrap.classList.add('hidden');

      if (liveStream) {
        liveStream.getTracks().forEach((t) => t.stop());
        liveStream = null;
      }
      liveVideoTrack = null;
      liveCameraVideo.srcObject = null;
    }

    function updateLiveCameraCounter() {
      liveShotCounter.textContent = `${liveSessionShots} / ${MAX_CONTINUOUS_SHOTS}`;
      liveShutterBtn.disabled = liveSessionShots >= MAX_CONTINUOUS_SHOTS;
      if (liveSessionShots > 0) {

    function updateSwitchCamLabel() {

        liveSwitchCamBtn.textContent = `切換鏡頭 ${liveDeviceIndex + 1}/${liveVideoDevices.length}`;

        liveSwitchCamBtn.textContent = '切換鏡頭';
      }

    async function configureTrackFocusAndControls(track) {
      if (!track || typeof track.getCapabilities !== 'function') return;

      const caps = track.getCapabilities();

      // 1. 強制啟用連續自動對焦（Continuous Autofocus）
      if (caps.focusMode && Array.isArray(caps.focusMode) && caps.focusMode.includes('continuous')) {
        try {
          await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        } catch (err) {
          console.warn('無法設定連續對焦:', err);
        }
      }

      // 2. 檢查是否支援補光燈（Torch）
      if (caps.torch) {
        liveTorchBtn.classList.remove('hidden');
        liveTorchOn = false;
        liveTorchBtn.textContent = '補光燈';
        liveTorchBtn.className = 'touch-btn px-2.5 py-1 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-semibold';
      } else {
        liveTorchBtn.classList.add('hidden');
      }

      // 3. 檢查是否支援手動對焦距離滑桿（focusDistance）
      if (
        caps.focusMode &&
        caps.focusMode.includes('manual') &&
        caps.focusDistance &&
        typeof caps.focusDistance.min === 'number' &&
        typeof caps.focusDistance.max === 'number'
      ) {
        liveFocusSlider.min = caps.focusDistance.min;
        liveFocusSlider.max = caps.focusDistance.max;
        liveFocusSlider.step = caps.focusDistance.step || ((caps.focusDistance.max - caps.focusDistance.min) / 50);
        const settings = track.getSettings ? track.getSettings() : {};
        liveFocusSlider.value = settings.focusDistance ?? ((caps.focusDistance.min + caps.focusDistance.max) / 2);
        liveManualFocusWrap.classList.remove('hidden');
        liveAutoFocusBtn.className = 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-[11px] font-bold shrink-0';
      } else {
        liveManualFocusWrap.classList.add('hidden');
      }
    }

    async function refreshCameraDeviceList(activeTrack) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
      try {
        const all = await navigator.mediaDevices.enumerateDevices();
        const vids = all.filter((d) => d.kind === 'videoinput');
        // 將後置鏡頭排在前面，前置鏡頭排在最後
        const backCams = vids.filter((d) => /back|rear|environment/i.test(d.label) && !/front|user/i.test(d.label));
        const otherCams = vids.filter((d) => !backCams.includes(d));
        liveVideoDevices = backCams.concat(otherCams);

        const activeId = activeTrack && activeTrack.getSettings ? activeTrack.getSettings().deviceId : null;
        if (activeId) {
          const foundIdx = liveVideoDevices.findIndex((d) => d.deviceId === activeId);
          if (foundIdx !== -1) liveDeviceIndex = foundIdx;
        }
        updateSwitchCamLabel();
      } catch (err) {
        console.warn('無法列舉相機裝置:', err);
      }
    }

    async function startLiveCamera(deviceId = null) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        cameraInput.click();
        return;
      }

      stopLiveCameraStream();

      try {
        const videoConstraints = deviceId
          ? {
              deviceId: { exact: deviceId },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          : {
              facingMode: { ideal: 'environment' },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            };

        liveStream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: videoConstraints
        });

        liveVideoTrack = liveStream.getVideoTracks()[0] || null;
        liveCameraVideo.srcObject = liveStream;
        await liveCameraVideo.play();

        liveCameraModal.classList.remove('hidden');
        updateLiveCameraCounter();

        await configureTrackFocusAndControls(liveVideoTrack);
        await refreshCameraDeviceList(liveVideoTrack);
      } catch (err) {
        console.warn('無法開啟內建即時相機，退回系統相機:', err);
        stopLiveCameraStream();
        liveCameraModal.classList.add('hidden');
        cameraInput.click();
      }
    }

    // 點擊取景畫面觸發硬體重新對焦
    async function triggerTapToFocus(clientX, clientY) {
      if (!liveVideoTrack) return;

      const wrapRect = liveVideoWrap.getBoundingClientRect();
      const relX = clientX - wrapRect.left;
      const relY = clientY - wrapRect.top;

      liveFocusRing.style.left = `${relX}px`;
      liveFocusRing.style.top = `${relY}px`;
      liveFocusRing.classList.remove('hidden', 'animate-focus-ring');
      void liveFocusRing.offsetWidth;
      liveFocusRing.classList.add('animate-focus-ring');

      if (typeof liveVideoTrack.getCapabilities !== 'function') return;
      const caps = liveVideoTrack.getCapabilities();

      const normX = Math.max(0, Math.min(1, relX / wrapRect.width));
      const normY = Math.max(0, Math.min(1, relY / wrapRect.height));

      liveFocusHint.textContent = '重新對焦中...';
      liveAutoFocusBtn.className = 'px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-[11px] font-bold shrink-0';

      try {
        // 先嘗試單次對焦 + 對焦點（Android Chrome 支援），再恢復連續自動對焦
        if (caps.focusMode && caps.focusMode.includes('single-shot')) {
          const singleConstraint = { focusMode: 'single-shot' };
          if (caps.pointsOfInterest) {
            singleConstraint.pointsOfInterest = [{ x: normX, y: normY }];
          }
          await liveVideoTrack.applyConstraints({ advanced: [singleConstraint] });
          setTimeout(async () => {
            if (liveVideoTrack && caps.focusMode.includes('continuous')) {
              try {
                await liveVideoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
              } catch (_) {}
            }
          }, 700);
        } else if (caps.focusMode && caps.focusMode.includes('continuous')) {
          await liveVideoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch (err) {
        console.warn('點擊對焦不支援:', err);
      }

      setTimeout(() => {
        liveFocusHint.textContent = '點擊畫面對焦 • 若模糊請點上方「切換鏡頭」';
      }, 900);
    }

    liveVideoWrap.addEventListener('click', (e) => {

    // 優先使用硬體 ImageCapture.takePhoto()（啟用硬體靜態對焦與高畫質），不支援時退回視訊擷取
    async function captureHighResFrame() {
      if (liveVideoTrack && typeof ImageCapture !== 'undefined') {
        try {
          const imageCapture = new ImageCapture(liveVideoTrack);
          const photoBlob = await imageCapture.takePhoto();
          if (photoBlob && photoBlob.size > 0) {
            return await readFileAsDataURL(photoBlob);
          }
        } catch (err) {
          console.warn('ImageCapture.takePhoto 失敗，改用畫面擷取:', err);
        }
      }

      const vw = liveCameraVideo.videoWidth;
      const vh = liveCameraVideo.videoHeight;
      const canvas = document.createElement('canvas');
      canvas.width = vw;
      canvas.height = vh;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(liveCameraVideo, 0, 0, vw, vh);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      canvas.width = 0;
      canvas.height = 0;
      return dataUrl;
    }

    async function captureLivePhoto() {
      if (liveIsCapturing || liveSessionShots >= MAX_CONTINUOUS_SHOTS) return;
      if (!liveCameraVideo.videoWidth || !liveCameraVideo.videoHeight) return;

      liveIsCapturing = true;
      liveShutterBtn.classList.add('opacity-60');

      // 快門閃光動畫
      liveShutterFlash.classList.remove('hidden', 'animate-shutter-flash');
      void liveShutterFlash.offsetWidth;
      liveShutterFlash.classList.add('animate-shutter-flash');

      try {
        const originalDataUrl = await captureHighResFrame();
        const wasEmpty = images.length === 0;
        const imgEl = await loadImageElement(originalDataUrl);

        let cropRect = null;
        let isCropped = false;
        if (autoCropEnabled) {
          const detected = detectDocumentRect(imgEl);
          if (detected) {
            cropRect = detected;
            isCropped = true;
          }
        }

        const processed = processImageWithRectAndFilter(
          imgEl,
          cropRect,
          globalScanFilter,
          globalBrightness,
          globalSharpness
        );

        const finalDataUrl = processed ? processed.dataUrl : originalDataUrl;

        images.push({
          id: 'img_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
          name: `掃描_${images.length + 1}.jpg`,
          originalDataUrl,
          dataUrl: finalDataUrl,
          rotation: 0,
          width: processed ? processed.width : imgEl.naturalWidth,
          height: processed ? processed.height : imgEl.naturalHeight,
          cropRect,
          isCropped,
          scanFilter: globalScanFilter
        });

        liveSessionShots++;
        liveLastThumb.src = finalDataUrl;
        updateLiveCameraCounter();
        invalidatePdfCache();
        renderGrid();

        if (wasEmpty && images.length > 0) {
          detectFirstLineLanguage(images[0].dataUrl);
        }

        if (liveSessionShots >= MAX_CONTINUOUS_SHOTS) {
          closeLiveCameraModal();
        }
      } catch (err) {
        console.error('拍照失敗:', err);
      } finally {
        liveIsCapturing = false;
        liveShutterBtn.classList.remove('opacity-60');
      }
    }

    liveShutterBtn.addEventListener('click', captureLivePhoto);

    // =========================================================================
    // 首頁上半部中/英文偵測（自動設定 P4C_ / P4E_）
    // =========================================================================
    async function detectFirstLineLanguage(dataUrl) {
      if (typeof Tesseract === 'undefined') return;
      if (filenameManuallyEdited) return;

      ocrDetectBadge.textContent = '偵測語言中...';
      ocrDetectBadge.classList.remove('hidden');

      try {
        const img = await loadImageElement(dataUrl);
        const cropH = Math.max(80, Math.round(img.naturalHeight * 0.55));
        const scale = Math.min(1, 1000 / img.naturalWidth);
        const cw = Math.max(100, Math.round(img.naturalWidth * scale));
        const ch = Math.max(80, Math.round(cropH * scale));

        const canvas = document.createElement('canvas');
        canvas.width = cw;
        canvas.height = ch;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, img.naturalWidth, cropH, 0, 0, cw, ch);

        const result = await Tesseract.recognize(canvas, 'chi_tra+eng');
        canvas.width = 0;
        canvas.height = 0;

        if (filenameManuallyEdited) {
          ocrDetectBadge.classList.add('hidden');
          return;
        }

        const rawText = (result && result.data && result.data.text) ? result.data.text : '';

        const enWords = rawText.match(/[A-Za-z]{3,}/g) || [];
        const enLetterCount = enWords.reduce((sum, w) => sum + w.length, 0);
        const zhChars = rawText.match(/[\u4e00-\u9fff]/g) || [];
        const zhCount = zhChars.length;

        const currentVal = pdfFilenameInput.value.trim();
        const isDefaultPrefix = currentVal === '' || /^P4[XCE]_$/i.test(currentVal);

        if (isDefaultPrefix) {
          if (enWords.length >= 3 && enLetterCount >= zhCount * 2) {
            pdfFilenameInput.value = 'P4E_';
            ocrDetectBadge.textContent = '偵測為英文 (P4E_)';
            invalidatePdfCache();
          } else if (zhCount >= 3 && zhCount * 2 > enLetterCount) {
            pdfFilenameInput.value = 'P4C_';
            ocrDetectBadge.textContent = '偵測為中文 (P4C_)';
            invalidatePdfCache();
          } else if (enLetterCount > zhCount) {
            pdfFilenameInput.value = 'P4E_';
            ocrDetectBadge.textContent = '偵測為英文 (P4E_)';
            invalidatePdfCache();
          } else if (zhCount > 0) {
            pdfFilenameInput.value = 'P4C_';
            ocrDetectBadge.textContent = '偵測為中文 (P4C_)';
            invalidatePdfCache();
          } else {
            ocrDetectBadge.classList.add('hidden');
          }
        } else {
          ocrDetectBadge.classList.add('hidden');
        }
      } catch (err) {
        console.warn('語言偵測失敗:', err);
        ocrDetectBadge.classList.add('hidden');
      }
    }

    pdfFilenameInput.addEventListener('input', () => {
      filenameManuallyEdited = true;

    }

    function syncAdjustLabels() {
      brightnessVal.textContent = globalBrightness > 0 ? `+${globalBrightness}` : String(globalBrightness);
      sharpnessVal.textContent = `${globalSharpness}%`;
    }

    async function reprocessAllImages(overrideFilter = null) {
      if (overrideFilter !== null) {
        globalScanFilter = overrideFilter;
        syncFilterButtonUI();
      }

      if (images.length === 0) return;

      showStatus(`正在更新全部 ${images.length} 張圖片...`, 'info');

      for (let i = 0; i < images.length; i++) {
        const item = images[i];
        if (overrideFilter !== null) {
          item.scanFilter = overrideFilter;
        }
        const mode = item.scanFilter || globalScanFilter;
        try {
          const imgEl = await loadImageElement(item.originalDataUrl);
          const processed = processImageWithRectAndFilter(imgEl, item.cropRect, mode, globalBrightness, globalSharpness);
          if (processed) {
            item.dataUrl = processed.dataUrl;
            item.width = processed.width;
            item.height = processed.height;
          } else {
            item.dataUrl = item.originalDataUrl;
            item.width = imgEl.naturalWidth;
            item.height = imgEl.naturalHeight;
          }
        } catch (err) {
          console.error('套用畫面調整失敗:', err);
        }
      }

      invalidatePdfCache();
      renderGrid();
      showStatus(`已更新全部 ${images.length} 張圖片（${filterLabelMap[globalScanFilter]}，亮度 ${brightnessVal.textContent}，銳利度 ${globalSharpness}%）。`, 'success');
    }

    brightnessSlider.addEventListener('input', () => {
      globalBrightness = Number(brightnessSlider.value);
      syncAdjustLabels();
    });
    brightnessSlider.addEventListener('change', () => {

    });

    sharpnessSlider.addEventListener('input', () => {
      globalSharpness = Number(sharpnessSlider.value);

    });
    sharpnessSlider.addEventListener('change', () => {
      reprocessAllImages(null);
    });

    resetAdjustBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      globalBrightness = 0;
      globalSharpness = 30;
      brightnessSlider.value = 0;
      sharpnessSlider.value = 30;
      syncAdjustLabels();
      reprocessAllImages(null);
    });

    syncPageNumberUI();
    syncAutoCropUI();
    syncFilterButtonUI();
    syncAdjustLabels();
    syncCycleButtonsUI();

    // =========================================================================
    // 文件標準矩形邊緣偵測、直接矩形裁切、銳利化與色彩濾鏡引擎（純 JS + Canvas）
    // =========================================================================
    function loadImageElement(src) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = src;
      });
    }

    function applyPostProcess(imgData, w, h, filterMode, brightness, sharpness) {
      const data = imgData.data;

      if (filterMode === 'bw') {
        const len = w * h;
        const lum = new Uint8Array(len);
        for (let i = 0, p = 0; i < len; i++, p += 4) {
          lum[i] = (data[p] * 77 + data[p + 1] * 150 + data[p + 2] * 29) >> 8;
        }

        // 1. 保留邊緣的降噪（只平滑相近灰階的紙張雜訊與黑框噪點，不模糊文字筆畫）
        const denoised = new Uint8Array(len);
        const rangeThresh = 26;
        for (let y = 0; y < h; y++) {
          const row = y * w;
          for (let x = 0; x < w; x++) {
            const idx = row + x;
            const c = lum[idx];
            if (x === 0 || x === w - 1 || y === 0 || y === h - 1) {
              denoised[idx] = c;
              continue;
            }
            let sum = c * 2;
            let weight = 2;
            const n1 = lum[idx - 1];
            const n2 = lum[idx + 1];
            const n3 = lum[idx - w];
            const n4 = lum[idx + w];

            if (Math.abs(n1 - c) <= rangeThresh) { sum += n1; weight++; }
            if (Math.abs(n2 - c) <= rangeThresh) { sum += n2; weight++; }
            if (Math.abs(n3 - c) <= rangeThresh) { sum += n3; weight++; }
            if (Math.abs(n4 - c) <= rangeThresh) { sum += n4; weight++; }

            denoised[idx] = (sum / weight) | 0;
          }
        }

        // 2. 門檻銳利化（只強化真正的文字邊緣，不放大背景顆粒）
        const sharpAmount = sharpness > 0 ? (sharpness / 100) * 1.1 : 0;
        const pivot = 148 - brightness;
        const contrast = 2.6;

        for (let y = 0; y < h; y++) {
          const row = y * w;
          for (let x = 0; x < w; x++) {
            const idx = row + x;
            let val = denoised[idx];

            if (sharpAmount > 0 && x > 0 && x < w - 1 && y > 0 && y < h - 1) {
              const avg = (denoised[idx - 1] + denoised[idx + 1] + denoised[idx - w] + denoised[idx + w]) * 0.25;
              const diff = val - avg;
              if (Math.abs(diff) > 10) {
                val += diff * sharpAmount;
              }
            }

            // 3. 黑白對比與純白紙張淨化
            val = (val - pivot) * contrast + 128;
            if (val > 235) val = 255;
            else if (val < 18) val = 0;

            const p = idx * 4;
            data[p] = data[p + 1] = data[p + 2] = val;
          }
        }
        return;
      }

      // 原圖 / 增亮模式：同樣使用門檻銳利化避免放大雜訊
      if (sharpness > 0 && w > 2 && h > 2) {
        const src = new Uint8ClampedArray(data);
        const k = (sharpness / 100) * 1.0;
        const rowStride = w * 4;

        for (let y = 1; y < h - 1; y++) {
          let idx = (y * w + 1) * 4;
          for (let x = 1; x < w - 1; x++) {
            const up = idx - rowStride;
            const dn = idx + rowStride;
            const lt = idx - 4;
            const rt = idx + 4;

            for (let c = 0; c < 3; c++) {
              const avg = (src[up + c] + src[dn + c] + src[lt + c] + src[rt + c]) * 0.25;
              const diff = src[idx + c] - avg;
              if (Math.abs(diff) > 10) {
                data[idx + c] = src[idx + c] + diff * k;
              }
            }
            idx += 4;
          }
        }
      }

      if (filterMode === 'enhance') {
        for (let i = 0; i < data.length; i += 4) {
          data[i]     = (data[i]     - 20) * 1.22 + brightness;
          data[i + 1] = (data[i + 1] - 20) * 1.22 + brightness;
          data[i + 2] = (data[i + 2] - 20) * 1.22 + brightness;
        }
      } else if (brightness !== 0) {
        for (let i = 0; i < data.length; i += 4) {
          data[i]     = data[i]     + brightness;
          data[i + 1] = data[i + 1] + brightness;
          data[i + 2] = data[i + 2] + brightness;
        }
      }
    }

    function processImageWithRectAndFilter(img, cropRect, filterMode = 'bw', brightness = 0, sharpness = 0) {
      const hasCrop = !!cropRect;
      const needsPixelFilter = filterMode !== 'none' || brightness !== 0 || sharpness > 0;

      if (!hasCrop && !needsPixelFilter) {
        return { dataUrl: img.src, width: img.naturalWidth, height: img.naturalHeight };
      }

      const sx = hasCrop ? Math.max(0, Math.round(cropRect.left * img.naturalWidth)) : 0;
      const sy = hasCrop ? Math.max(0, Math.round(cropRect.top * img.naturalHeight)) : 0;
      const sw = hasCrop
        ? Math.max(20, Math.min(img.naturalWidth - sx, Math.round((cropRect.right - cropRect.left) * img.naturalWidth)))
        : img.naturalWidth;
      const sh = hasCrop
        ? Math.max(20, Math.min(img.naturalHeight - sy, Math.round((cropRect.bottom - cropRect.top) * img.naturalHeight)))
        : img.naturalHeight;

      const maxWorkDim = 2200;
      const scale = Math.min(1, maxWorkDim / Math.max(sw, sh));
      const outW = Math.max(20, Math.round(sw * scale));
      const outH = Math.max(20, Math.round(sh * scale));

      const canvas = document.createElement('canvas');
      canvas.width = outW;
      canvas.height = outH;
      const ctx = canvas.getContext('2d', { willReadFrequently: needsPixelFilter });
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);

      if (needsPixelFilter) {
        const imgData = ctx.getImageData(0, 0, outW, outH);
        applyPostProcess(imgData, outW, outH, filterMode, brightness, sharpness);
        ctx.putImageData(imgData, 0, 0);
      }

      const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
      canvas.width = 0;
      canvas.height = 0;

      return { dataUrl, width: outW, height: outH };
    }

    function detectDocumentRect(img) {
      const maxDetectDim = 320;
      const scale = Math.min(1, maxDetectDim / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.max(40, Math.round(img.naturalWidth * scale));
      const h = Math.max(40, Math.round(img.naturalHeight * scale));

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      const rgba = ctx.getImageData(0, 0, w, h).data;

      const centerSamples = [];
      const cx0 = Math.floor(w * 0.22), cx1 = Math.floor(w * 0.78);
      const cy0 = Math.floor(h * 0.22), cy1 = Math.floor(h * 0.78);
      for (let y = cy0; y < cy1; y += 2) {
        for (let x = cx0; x < cx1; x += 2) {
          const p = (y * w + x) * 4;
          const r = rgba[p], g = rgba[p + 1], b = rgba[p + 2];
          const lum = 0.299 * r + 0.587 * g + 0.114 * b;
          centerSamples.push({ r, g, b, lum });
        }
      }
      centerSamples.sort((a, b) => a.lum - b.lum);
      const brightStart = Math.floor(centerSamples.length * 0.4);
      let paperR = 0, paperG = 0, paperB = 0, paperLum = 0;
      const brightCount = Math.max(1, centerSamples.length - brightStart);
      for (let i = brightStart; i < centerSamples.length; i++) {
        paperR += centerSamples[i].r;
        paperG += centerSamples[i].g;
        paperB += centerSamples[i].b;
        paperLum += centerSamples[i].lum;
      }
      paperR /= brightCount;
      paperG /= brightCount;
      paperB /= brightCount;
      paperLum /= brightCount;

      let bgR = 0, bgG = 0, bgB = 0, bgLum = 0, bgCount = 0;
      const bx = Math.max(2, Math.floor(w * 0.04));
      const by = Math.max(2, Math.floor(h * 0.04));
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (x < bx || x >= w - bx || y < by || y >= h - by) {
            const p = (y * w + x) * 4;
            const r = rgba[p], g = rgba[p + 1], b = rgba[p + 2];
            bgR += r;
            bgG += g;
            bgB += b;
            bgLum += 0.299 * r + 0.587 * g + 0.114 * b;
            bgCount++;
          }
        }
      }
      bgR /= Math.max(1, bgCount);
      bgG /= Math.max(1, bgCount);
      bgB /= Math.max(1, bgCount);
      bgLum /= Math.max(1, bgCount);

      const colorDiff = Math.hypot(paperR - bgR, paperG - bgG, paperB - bgB);
      const lumDiff = Math.abs(paperLum - bgLum);
      if (colorDiff < 24 && lumDiff < 18) {
        canvas.width = 0;
        canvas.height = 0;
        return null;
      }

      const outside = new Uint8Array(w * h);
      const queue = new Int32Array(w * h);
      let head = 0, tail = 0;

      const isBackgroundPixel = (idx) => {
        const p = idx * 4;
        const r = rgba[p], g = rgba[p + 1], b = rgba[p + 2];
        const distToBg = Math.hypot(r - bgR, g - bgG, b - bgB);
        const distToPaper = Math.hypot(r - paperR, g - paperG, b - paperB);
        return distToBg < distToPaper * 0.92;
      };

      const enqueueIfBg = (x, y) => {
        const idx = y * w + x;
        if (!outside[idx] && isBackgroundPixel(idx)) {
          outside[idx] = 1;
          queue[tail++] = idx;
        }
      };

      for (let x = 0; x < w; x++) {
        enqueueIfBg(x, 0);
        enqueueIfBg(x, h - 1);
      }
      for (let y = 0; y < h; y++) {
        enqueueIfBg(0, y);
        enqueueIfBg(w - 1, y);
      }

      while (head < tail) {
        const idx = queue[head++];
        const x = idx % w;
        const y = (idx - x) / w;
        if (x > 0) enqueueIfBg(x - 1, y);
        if (x < w - 1) enqueueIfBg(x + 1, y);
        if (y > 0) enqueueIfBg(x, y - 1);
        if (y < h - 1) enqueueIfBg(x, y + 1);
      }

      if (tail < w * h * 0.04) {
        canvas.width = 0;
        canvas.height = 0;
        return null;
      }

      const visited = new Uint8Array(w * h);
      const minNoisePixels = Math.max(12, Math.floor(w * h * 0.0015));
      let unionMinX = w, unionMaxX = 0, unionMinY = h, unionMaxY = 0;
      let foundValid = false;

      for (let i = 0; i < w * h; i++) {
        if (outside[i] || visited[i]) continue;
        let qh = 0, qt = 0;
        visited[i] = 1;
        queue[qt++] = i;

        let minX = w, maxX = 0, minY = h, maxY = 0;

        while (qh < qt) {
          const cur = queue[qh++];
          const x = cur % w;
          const y = (cur - x) / w;
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;

          if (x > 0 && !outside[cur - 1] && !visited[cur - 1]) { visited[cur - 1] = 1; queue[qt++] = cur - 1; }
          if (x < w - 1 && !outside[cur + 1] && !visited[cur + 1]) { visited[cur + 1] = 1; queue[qt++] = cur + 1; }
          if (y > 0 && !outside[cur - w] && !visited[cur - w]) { visited[cur - w] = 1; queue[qt++] = cur - w; }
          if (y < h - 1 && !outside[cur + w] && !visited[cur + w]) { visited[cur + w] = 1; queue[qt++] = cur + w; }
        }

        if (qt >= minNoisePixels) {
          if (minX < unionMinX) unionMinX = minX;
          if (maxX > unionMaxX) unionMaxX = maxX;
          if (minY < unionMinY) unionMinY = minY;
          if (maxY > unionMaxY) unionMaxY = maxY;
          foundValid = true;
        }
      }

      canvas.width = 0;
      canvas.height = 0;

      if (!foundValid) return null;

      const pad = 0.02;
      const snapEdge = 0.06;
      let left = Math.max(0, unionMinX / w - pad);
      let top = Math.max(0, unionMinY / h - pad);
      let right = Math.min(1, (unionMaxX + 1) / w + pad);
      let bottom = Math.min(1, (unionMaxY + 1) / h + pad);

      if (left < snapEdge) left = 0;
      if (top < snapEdge) top = 0;
      if (right > 1 - snapEdge) right = 1;
      if (bottom > 1 - snapEdge) bottom = 1;

      const rw = right - left;
      const rh = bottom - top;
      const areaRatio = rw * rh;

      if (rw < 0.20 || rh < 0.20 || areaRatio < 0.12 || areaRatio > 0.96) {
        return null;
      }

      return { left, top, right, bottom };
    }

    // =========================================================================
    // 互動式矩形裁切視窗
    // =========================================================================
    let activeCropId = null;
    let activeCropImg = null;
    let activeCropRect = null;
    let activeCropFilter = 'bw';
    let dragMode = null;
    let dragStartPos = null;
    let dragStartRect = null;

    function syncCropFilterButtons() {
      document.querySelectorAll('.crop-filter-btn').forEach((btn) => {
        const isActive = btn.dataset.filter === activeCropFilter;
        btn.className = isActive
          ? 'crop-filter-btn flex-1 py-2 px-3 rounded-xl text-xs font-semibold border border-indigo-500 bg-indigo-600 text-white transition-all'
          : 'crop-filter-btn flex-1 py-2 px-3 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all';
      });
    }

    document.querySelectorAll('.crop-filter-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeCropFilter = btn.dataset.filter;
        syncCropFilterButtons();
      });
    });

    function drawCropEditor() {
      if (!activeCropImg || !activeCropRect) return;
      const wrapRect = cropCanvasWrap.getBoundingClientRect();
      const availW = Math.max(200, wrapRect.width - 24);
      const availH = Math.max(200, wrapRect.height - 24);
      const imgRatio = activeCropImg.naturalWidth / activeCropImg.naturalHeight;

      let drawW = availW;
      let drawH = drawW / imgRatio;
      if (drawH > availH) {
        drawH = availH;
        drawW = drawH * imgRatio;
      }

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      cropCanvas.style.width = `${Math.round(drawW)}px`;
      cropCanvas.style.height = `${Math.round(drawH)}px`;
      cropCanvas.width = Math.round(drawW * dpr);
      cropCanvas.height = Math.round(drawH * dpr);

      const ctx = cropCanvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      ctx.drawImage(activeCropImg, 0, 0, drawW, drawH);

      const x0 = activeCropRect.left * drawW;
      const y0 = activeCropRect.top * drawH;
      const x1 = activeCropRect.right * drawW;
      const y1 = activeCropRect.bottom * drawH;
      const rw = x1 - x0;
      const rh = y1 - y0;

      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.58)';
      ctx.beginPath();
      ctx.rect(0, 0, drawW, drawH);
      ctx.rect(x0, y0, rw, rh);
      ctx.fill('evenodd');
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = '#34d399';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(x0, y0, rw, rh);

      ctx.strokeStyle = 'rgba(52, 211, 153, 0.35)';
      ctx.lineWidth = 1;
      for (const t of [1 / 3, 2 / 3]) {
        ctx.beginPath();
        ctx.moveTo(x0 + rw * t, y0);
        ctx.lineTo(x0 + rw * t, y1);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x0, y0 + rh * t);
        ctx.lineTo(x1, y0 + rh * t);
        ctx.stroke();
      }
      ctx.restore();

      const handles = [
        { key: 'tl', x: x0, y: y0 },
        { key: 'tr', x: x1, y: y0 },
        { key: 'br', x: x1, y: y1 },
        { key: 'bl', x: x0, y: y1 }
      ];

      handles.forEach((h) => {
        const isDragging = dragMode === h.key;
        ctx.save();
        ctx.beginPath();
        ctx.arc(h.x, h.y, isDragging ? 15 : 12, 0, Math.PI * 2);
        ctx.fillStyle = isDragging ? 'rgba(99, 102, 241, 0.95)' : 'rgba(16, 185, 129, 0.92)';
        ctx.fill();
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(h.x, h.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      });
    }

    async function openCropModal(itemId) {
      const item = images.find((i) => i.id === itemId);
      if (!item) return;

      activeCropId = itemId;
      activeCropFilter = item.scanFilter || globalScanFilter;
      syncCropFilterButtons();

      cropModal.classList.remove('hidden');
      activeCropImg = await loadImageElement(item.originalDataUrl);

      if (item.cropRect) {
        activeCropRect = { ...item.cropRect };
      } else {
        const detected = detectDocumentRect(activeCropImg);
        activeCropRect = detected || { left: 0.02, top: 0.02, right: 0.98, bottom: 0.98 };
      }

      requestAnimationFrame(drawCropEditor);
    }

    function closeCropModal() {
      cropModal.classList.add('hidden');
      activeCropId = null;
      activeCropImg = null;
      dragMode = null;
    }

    function getPointerNormPos(e) {
      const rect = cropCanvas.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
      return { x, y, px: e.clientX - rect.left, py: e.clientY - rect.top, w: rect.width, h: rect.height };
    }

    cropCanvas.addEventListener('pointerdown', (e) => {
      if (!activeCropRect) return;
      const pos = getPointerNormPos(e);
      const handles = [
        { key: 'tl', x: activeCropRect.left * pos.w, y: activeCropRect.top * pos.h },
        { key: 'tr', x: activeCropRect.right * pos.w, y: activeCropRect.top * pos.h },
        { key: 'br', x: activeCropRect.right * pos.w, y: activeCropRect.bottom * pos.h },
        { key: 'bl', x: activeCropRect.left * pos.w, y: activeCropRect.bottom * pos.h }
      ];

      let closest = null;
      let minDist = 42;
      for (const h of handles) {
        const d = Math.hypot(h.x - pos.px, h.y - pos.py);
        if (d < minDist) {
          minDist = d;
          closest = h.key;
        }
      }

      if (closest) {
        dragMode = closest;
      } else if (
        pos.x >= activeCropRect.left && pos.x <= activeCropRect.right &&
        pos.y >= activeCropRect.top && pos.y <= activeCropRect.bottom
      ) {
        dragMode = 'move';
        dragStartPos = { x: pos.x, y: pos.y };
        dragStartRect = { ...activeCropRect };
      }

      if (dragMode) {
        cropCanvas.setPointerCapture(e.pointerId);
        drawCropEditor();
      }
    });

    cropCanvas.addEventListener('pointermove', (e) => {
      if (!dragMode || !activeCropRect) return;
      const pos = getPointerNormPos(e);
      const minSize = 0.08;

      if (dragMode === 'tl') {
        activeCropRect.left = Math.min(pos.x, activeCropRect.right - minSize);
        activeCropRect.top = Math.min(pos.y, activeCropRect.bottom - minSize);
      } else if (dragMode === 'tr') {
        activeCropRect.right = Math.max(pos.x, activeCropRect.left + minSize);
        activeCropRect.top = Math.min(pos.y, activeCropRect.bottom - minSize);
      } else if (dragMode === 'br') {
        activeCropRect.right = Math.max(pos.x, activeCropRect.left + minSize);
        activeCropRect.bottom = Math.max(pos.y, activeCropRect.top + minSize);
      } else if (dragMode === 'bl') {
        activeCropRect.left = Math.min(pos.x, activeCropRect.right - minSize);
        activeCropRect.bottom = Math.max(pos.y, activeCropRect.top + minSize);
      } else if (dragMode === 'move' && dragStartPos && dragStartRect) {
        const dx = pos.x - dragStartPos.x;
        const dy = pos.y - dragStartPos.y;
        const rw = dragStartRect.right - dragStartRect.left;
        const rh = dragStartRect.bottom - dragStartRect.top;
        const newLeft = Math.max(0, Math.min(1 - rw, dragStartRect.left + dx));
        const newTop = Math.max(0, Math.min(1 - rh, dragStartRect.top + dy));
        activeCropRect = {
          left: newLeft,
          top: newTop,
          right: newLeft + rw,
          bottom: newTop + rh
        };
      }

      drawCropEditor();
    });

    cropCanvas.addEventListener('pointerup', (e) => {
      if (dragMode) {
        dragMode = null;
        try { cropCanvas.releasePointerCapture(e.pointerId); } catch (_) {}

      return new Promise((resolve, reject) => {

    async function handleFiles(fileList) {
      const files = Array.from(fileList).filter((file) => file.type.startsWith('image/'));
      if (files.length === 0) {
        showStatus('請選擇有效的圖片檔案（JPG、PNG、WebP）。', 'error');
        return;
      }

      const wasEmpty = images.length === 0;

      showStatus(
        autoCropEnabled
          ? `正在載入並自動矩形裁切 ${files.length} 張圖片...`
          : `正在載入 ${files.length} 張圖片...`,
        'info'
      );

      let croppedCount = 0;

      for (const file of files) {
        try {
          const originalDataUrl = await readFileAsDataURL(file);
          const imgEl = await loadImageElement(originalDataUrl);

          let cropRect = null;
          let isCropped = false;

          if (autoCropEnabled) {
            const detected = detectDocumentRect(imgEl);
            if (detected) {
              cropRect = detected;
              isCropped = true;
              croppedCount++;
            }
          }

          const processed = processImageWithRectAndFilter(
            imgEl,
            cropRect,
            globalScanFilter,
            globalBrightness,
            globalSharpness
          );

          images.push({
            id: 'img_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
            name: file.name || `掃描_${images.length + 1}.jpg`,
            originalDataUrl,
            dataUrl: processed ? processed.dataUrl : originalDataUrl,
            rotation: 0,
            width: processed ? processed.width : imgEl.naturalWidth,
            height: processed ? processed.height : imgEl.naturalHeight,
            cropRect,
            isCropped,
            scanFilter: globalScanFilter
          });
        } catch (err) {
          console.error('載入圖片失敗:', err);
        }
      }

      invalidatePdfCache();
      renderGrid();

      if (wasEmpty && images.length > 0) {
        detectFirstLineLanguage(images[0].dataUrl);
      }

      if (autoCropEnabled) {
        if (croppedCount > 0) {
          showStatus(`已加入 ${files.length} 張圖片（自動矩形裁切 ${croppedCount} 張，模式：${filterLabelMap[globalScanFilter]}）。`, 'success');
        } else {
          showStatus(`已加入 ${files.length} 張圖片（未偵測到背景外框，保留全圖，模式：${filterLabelMap[globalScanFilter]}）。`, 'info');
        }
      } else {
        showStatus(`已加入 ${files.length} 張圖片（模式：${filterLabelMap[globalScanFilter]}）。`, 'success');
      }
    }

    // =========================================================================
    // PDF 產生與右下角頁碼繪製
    // =========================================================================
    function renderRotatedImageForPdf(item, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = quality >= 0.95 ? 4000 : quality >= 0.85 ? 2400 : 1600;
          let srcW = img.naturalWidth;
          let srcH = img.naturalHeight;

          if (srcW > maxDim || srcH > maxDim) {
            const scale = maxDim / Math.max(srcW, srcH);
            srcW = Math.round(srcW * scale);
            srcH = Math.round(srcH * scale);
          }

          const rot = item.rotation % 360;
          const swap = rot === 90 || rot === 270;
          const canvasW = swap ? srcH : srcW;
          const canvasH = swap ? srcW : srcH;

          const canvas = document.createElement('canvas');
          canvas.width = canvasW;
          canvas.height = canvasH;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvasW, canvasH);

          ctx.translate(canvasW / 2, canvasH / 2);
          ctx.rotate((rot * Math.PI) / 180);
          ctx.drawImage(img, -srcW / 2, -srcH / 2, srcW, srcH);

          const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
          canvas.width = 0;
          canvas.height = 0;

          resolve({ dataUrl: jpegDataUrl, width: canvasW, height: canvasH });
        };
        img.onerror = reject;
        img.src = item.dataUrl;
      });
    }

    function drawBottomRightPageNumber(doc, pageIndex, totalPages, pageW, pageH) {
      const label = `Page ${pageIndex}/${totalPages}`;

      const fontSize = Math.max(10, Math.round(Math.min(pageW, pageH) * 0.055));
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(fontSize);

      const textW = doc.getTextWidth(label);
      const textH = fontSize * 0.352778;
      const padX = Math.max(2, textH * 0.5);
      const padY = Math.max(1.2, textH * 0.3);
      const edgeX = Math.max(5, Math.min(10, pageW * 0.03));
      const edgeY = Math.max(5, Math.min(10, pageH * 0.025));

      const boxW = textW + padX * 2;
      const boxH = textH + padY * 2;
      const boxX = pageW - edgeX - boxW;
      const boxY = pageH - edgeY - boxH;

      doc.setFillColor(255, 255, 255);
      doc.roundedRect(boxX, boxY, boxW, boxH, 1.2, 1.2, 'F');

      doc.setTextColor(15, 23, 42);
      const textBaselineY = boxY + padY + textH * 0.82;
      doc.text(label, boxX + boxW - padX, textBaselineY, { align: 'right' });
    }

    function getSanitizedFilename() {
      const raw = (pdfFilenameInput.value || 'P4X_').trim();
      const cleaned = raw.replace(/[<>:"/\\|?*]+/g, '-').replace(/\.pdf$/i, '') || 'P4X_';
      return `${cleaned}.pdf`;
    }

    async function buildPdfBlob() {
      const pageSize = pageSizeSelect.value;
      const imageFit = selectedImageFit;
      const quality = selectedQuality || 0.85;
      const margin = selectedMargin;
      const totalPages = images.length;

      let doc = null;

      for (let i = 0; i < totalPages; i++) {
        showStatus(`正在處理第 ${i + 1} / ${totalPages} 頁...`, 'info');
        const rendered = await renderRotatedImageForPdf(images[i], quality);

        let pageW, pageH;

        if (pageSize === 'fit') {
          const pxToMm = 25.4 / 96;
          pageW = Math.max(20, rendered.width * pxToMm);
          pageH = Math.max(20, rendered.height * pxToMm);
          const orient = pageW >= pageH ? 'l' : 'p';

          if (!doc) {
            doc = new jsPDF({ orientation: orient, unit: 'mm', format: [pageW, pageH], compress: true });
          } else {
            doc.addPage([pageW, pageH], orient);
          }

          doc.addImage(rendered.dataUrl, 'JPEG', 0, 0, pageW, pageH, undefined, 'FAST');
        } else {
          const orient = selectedOrientation === 'landscape' ? 'l' : 'p';
          if (!doc) {
            doc = new jsPDF({ orientation: orient, unit: 'mm', format: pageSize, compress: true });
          } else {
            doc.addPage(pageSize, orient);
          }

          pageW = doc.internal.pageSize.getWidth();
          pageH = doc.internal.pageSize.getHeight();
          const topMargin = margin;
          const bottomMargin = showPageNumbers ? Math.max(margin, 14) : margin;
          const availW = Math.max(10, pageW - margin * 2);
          const availH = Math.max(10, pageH - topMargin - bottomMargin);

          const imgRatio = rendered.width / rendered.height;
          const boxRatio = availW / availH;

          let drawW, drawH, offsetX, offsetY;

          if (imageFit === 'cover') {
            if (imgRatio > boxRatio) {
              drawH = availH;
              drawW = drawH * imgRatio;
            } else {
              drawW = availW;
              drawH = drawW / imgRatio;
            }
            offsetX = margin + (availW - drawW) / 2;
            offsetY = topMargin + (availH - drawH) / 2;
          } else {
            if (imgRatio > boxRatio) {
              drawW = availW;
              drawH = drawW / imgRatio;
            } else {
              drawH = availH;
              drawW = drawH * imgRatio;
            }
            offsetX = margin + (availW - drawW) / 2;
            offsetY = topMargin + (availH - drawH) / 2;
          }

          doc.addImage(rendered.dataUrl, 'JPEG', offsetX, offsetY, drawW, drawH, undefined, 'FAST');
        }

        if (showPageNumbers) {
          drawBottomRightPageNumber(doc, i + 1, totalPages, pageW, pageH);
        }
      }

      const filename = getSanitizedFilename();
      const blob = doc.output('blob');
      lastGeneratedBlob = blob;
      lastGeneratedFilename = filename;
      return { blob, filename };
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    async function ensurePdfReady() {
      if (lastGeneratedBlob) {
        return { blob: lastGeneratedBlob, filename: lastGeneratedFilename };
      }
      return await buildPdfBlob();
    }

    async function handleConvertAndDownload() {
      if (images.length === 0 || isConverting) return;
      isConverting = true;
      updatePdfPageCount();

      try {
        const { blob, filename } = await buildPdfBlob();
        triggerDownload(blob, filename);
        showStatus(`已下載「${filename}」（共 ${images.length} 頁）。`, 'success');
      } catch (err) {
        console.error('建立 PDF 失敗:', err);
        showStatus('建立 PDF 失敗，請嘗試降低圖片品質後重試。', 'error');
      } finally {
        isConverting = false;
        updatePdfPageCount();
      }
    }

    // =========================================================================
    // 分享功能（WhatsApp / Google Drive / 系統原生分享）
    // =========================================================================
    function openShareModal() {
      if (images.length === 0 || isConverting) return;
      shareModal.classList.remove('hidden');
    }

    function closeShareModal() {
      shareModal.classList.add('hidden');
    }

    closeShareModalBtn.addEventListener('click', closeShareModal);
    shareModal.addEventListener('click', (e) => {
      if (e.target === shareModal) closeShareModal();
    });

    async function tryNativeFileShare(blob, filename, shareText) {
      if (!canNativeShare) return false;
      const file = new File([blob], filename, { type: 'application/pdf' });
      if (navigator.canShare && !navigator.canShare({ files: [file] })) {
        return false;
      }
      await navigator.share({
        title: filename,
        text: shareText,
        files: [file]
      });
      return true;
    }

    async function executeShare(target) {
      if (images.length === 0 || isConverting) return;
      isConverting = true;
      updatePdfPageCount();
      closeShareModal();

      let targetPopup = null;
      if (!isMobileDevice && (target === 'drive' || target === 'whatsapp')) {
        targetPopup = window.open('about:blank', '_blank');
      }

      try {
        const { blob, filename } = await ensurePdfReady();

        if (target === 'download') {
          triggerDownload(blob, filename);
          showStatus(`已下載「${filename}」。`, 'success');
          return;
        }

        if (target === 'native') {
          const shared = await tryNativeFileShare(blob, filename, `分享 PDF：${filename}`);
          if (shared) {
            showStatus('已開啟系統分享選單。', 'success');
          } else {
            triggerDownload(blob, filename);
            showStatus('此瀏覽器不支援直接分享檔案，已自動下載 PDF。', 'info');
          }
          return;
        }

        if (target === 'whatsapp') {
          if (isMobileDevice) {
            const shared = await tryNativeFileShare(blob, filename, `請於選單選擇 WhatsApp 傳送「${filename}」`);
            if (shared) {
              showStatus('已透過系統選單分享至 WhatsApp。', 'success');
              return;
            }
          }
          triggerDownload(blob, filename);
          const waUrl = isMobileDevice
            ? `https://wa.me/?text=${encodeURIComponent(`已建立 PDF 檔案：${filename}`)}`
            : 'https://web.whatsapp.com/';
          if (targetPopup && !targetPopup.closed) {
            targetPopup.location.href = waUrl;
          } else {
            window.open(waUrl, '_blank', 'noopener,noreferrer');
          }
          showStatus(`已下載「${filename}」並開啟 WhatsApp，請將檔案拖曳或附加傳送。`, 'success');
          return;
        }

        if (target === 'drive') {
          if (isMobileDevice) {
            const shared = await tryNativeFileShare(blob, filename, `請於選單選擇 Google Drive 儲存「${filename}」`);
            if (shared) {
              showStatus('已透過系統選單儲存至 Google Drive。', 'success');
              return;
            }
          }
          triggerDownload(blob, filename);
          const driveUrl = 'https://drive.google.com/drive/my-drive';
          if (targetPopup && !targetPopup.closed) {
            targetPopup.location.href = driveUrl;
          } else {
            window.open(driveUrl, '_blank', 'noopener,noreferrer');
          }
          showStatus(`已下載「${filename}」並開啟 Google Drive，請將檔案拖曳至頁面內上傳。`, 'success');
        }
      } catch (err) {
        if (targetPopup && !targetPopup.closed) {
          targetPopup.close();
        }
        if (err && err.name !== 'AbortError') {
          console.error('分享失敗:', err);
          showStatus('分享失敗，請改用直接下載功能。', 'error');
        }
      } finally {
        isConverting = false;
        updatePdfPageCount();
      }
    }

    convertBtn.addEventListener('click', handleConvertAndDownload);
    headerConvertBtn.addEventListener('click', handleConvertAndDownload);
    mobileConvertBtn.addEventListener('click', handleConvertAndDownload);

    mobileShareBtn.addEventListener('click', openShareModal);
    desktopShareBtn.addEventListener('click', openShareModal);

    shareWhatsAppBtn.addEventListener('click', () => executeShare('whatsapp'));
    shareDriveBtn.addEventListener('click', () => executeShare('drive'));
    shareNativeBtn.addEventListener('click', () => executeShare('native'));
    shareDownloadBtn.addEventListener('click', () => executeShare('download'));

    // =========================================================================
    // 狀態提示列
    // =========================================================================
    let statusTimer = null;
    function showStatus(text, type = 'info') {
      statusMessage.textContent = text;
      statusMessage.classList.remove('hidden');
      if (type === 'error') {
        statusMessage.className = 'text-xs font-medium text-center py-2 px-3 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800';
      } else if (type === 'success') {
        statusMessage.className = 'text-xs font-medium text-center py-2 px-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800';
      } else {
        statusMessage.className = 'text-xs font-medium text-center py-2 px-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800';
      }

      if (statusTimer) clearTimeout(statusTimer);
      statusTimer = setTimeout(() => {
        statusMessage.classList.add('hidden');
      }, 5000);
    }

    renderGrid();
  </script>
</body>
</html>
