<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta id="themeColorMeta" name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PDF merge — 圖片合併工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    };
    (function () {
      const savedTheme = localStorage.getItem('pdfmerge_theme');
      const isDark = savedTheme !== 'light';
      document.documentElement.classList.toggle('dark', isDark);
      const meta = document.getElementById('themeColorMeta');
      if (meta) meta.setAttribute('content', isDark ? '#0f172a' : '#4f46e5');
    })();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

    * {
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      padding-bottom: env(safe-area-inset-bottom);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    .sortable-ghost {
      opacity: 0.35;
      transform: scale(0.97);
    }
    .sortable-chosen {
      box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.25), 0 8px 10px -6px rgba(79, 70, 229, 0.2);
      border-color: #6366f1 !important;
      z-index: 20;
    }
    .sortable-drag {
      opacity: 0.95;
    }

    .drag-over {
      border-color: #6366f1 !important;
      background-color: #eef2ff !important;
    }
    .dark .drag-over {
      border-color: #818cf8 !important;
      background-color: rgba(79, 70, 229, 0.15) !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }

    .touch-btn {
      min-height: 44px;
      touch-action: manipulation;
    }

    .drag-handle {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200">

  <!-- 頂部導覽列 -->
  <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-30 transition-colors">
    <div class="max-w-6xl mx-auto px-3.5 sm:px-6 h-14 sm:h-16 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-sm shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 13h6m-6 4h4" />
          </svg>
        </div>
        <div class="truncate">
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900 dark:text-white leading-none truncate">PDF merge</h1>
          <p class="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 mt-0.5 truncate">圖片轉 PDF 合併工具</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <!-- 深淺色模式切換按鈕 -->
        <button id="themeToggleBtn" type="button" aria-label="切換深色或淺色模式" title="切換模式" class="touch-btn w-10 h-10 sm:w-auto sm:px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 inline-flex items-center justify-center gap-1.5 transition-colors">
          <!-- 太陽圖示（深色模式顯示） -->
          <svg class="w-4 h-4 text-amber-400 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <!-- 月亮圖示（淺色模式顯示） -->
          <svg class="w-4 h-4 text-indigo-600 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <span id="themeToggleText" class="hidden sm:inline text-xs font-semibold">淺色模式</span>
        </button>

        <button id="clearAllBtn" type="button" class="hidden touch-btn px-3 py-2 text-xs sm:text-sm font-medium text-rose-600 dark:text-rose-400 bg-rose-50 hover:bg-rose-100 active:bg-rose-200 dark:bg-rose-950/50 dark:hover:bg-rose-900/60 rounded-xl transition-colors">
          全部清除
        </button>

        <button id="headerConvertBtn" type="button" disabled class="hidden sm:inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 dark:disabled:bg-slate-800 dark:disabled:text-slate-500 disabled:cursor-not-allowed rounded-xl shadow-sm transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          <span>建立 PDF</span>
          <span id="headerCountBadge" class="hidden bg-indigo-500 text-white text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主要內容 -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-3.5 sm:px-6 pt-4 sm:pt-8 pb-28 lg:pb-10">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 lg:gap-8 items-start">

      <!-- 左欄：上傳與頁面排列區 -->
      <div class="lg:col-span-8 space-y-4 sm:space-y-5">

        <!-- 上傳區 -->
        <div id="dropZone" class="border-2 border-dashed border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 rounded-2xl p-5 sm:p-8 text-center transition-all hover:border-indigo-400 dark:hover:border-indigo-500 cursor-pointer">
          <input id="fileInput" type="file" accept="image/*" multiple class="hidden" />
          <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" />

          <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-50 dark:bg-indigo-950/70 text-indigo-600 dark:text-indigo-400 flex items-center justify-center mx-auto mb-3">
            <svg class="w-6 h-6 sm:w-7 sm:h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
          <h2 class="text-base sm:text-lg font-semibold text-slate-800 dark:text-slate-100">加入要合併的圖片</h2>
          <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-md mx-auto">
            從相簿選擇、拖曳圖片到此處，或直接使用相機拍攝。
          </p>

          <div class="mt-4 sm:mt-5 flex flex-col sm:flex-row items-stretch sm:items-center justify-center gap-2.5 sm:gap-3 max-w-md mx-auto">
            <button id="browseBtn" type="button" class="touch-btn flex-1 inline-flex items-center justify-center gap-2 px-4 py-3 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-xl shadow-sm transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
              </svg>
              <span>選擇圖片</span>
            </button>

            <button id="cameraBtn" type="button" class="touch-btn flex-1 inline-flex items-center justify-center gap-2 px-4 py-3 text-sm font-semibold text-indigo-700 dark:text-indigo-300 bg-indigo-50 hover:bg-indigo-100 active:bg-indigo-200 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/70 border border-indigo-200 dark:border-indigo-800 rounded-xl transition-colors">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <span>立即拍照</span>
            </button>
          </div>
        </div>

        <!-- 頁面標題列 -->
        <div id="workspaceHeader" class="hidden flex flex-wrap items-center justify-between gap-2 pt-1">
          <div class="flex items-center gap-2">
            <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100">頁面列表（共 <span id="imageCount">0</span> 頁）</h3>
            <span class="text-xs text-slate-500 dark:text-slate-400 bg-slate-200/70 dark:bg-slate-800 px-2.5 py-1 rounded-full hidden sm:inline">按住右上角圖示可拖曳排序</span>
          </div>

          <div class="flex items-center gap-2 ml-auto">
            <button id="addMoreBtn" type="button" class="touch-btn px-3 py-2 text-xs sm:text-sm font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/70 rounded-xl inline-flex items-center gap-1.5 transition-colors">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              <span>新增圖片</span>
            </button>
          </div>
        </div>

        <!-- 圖片格線 -->
        <div id="imageGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3.5 sm:gap-4"></div>

        <!-- 空狀態提示 -->
        <div id="emptyStateHint" class="text-center py-6 text-slate-400 dark:text-slate-500 text-xs sm:text-sm">
          尚未加入任何圖片。請點擊上方的 <span class="font-medium text-slate-600 dark:text-slate-300">選擇圖片</span> 或 <span class="font-medium text-slate-600 dark:text-slate-300">立即拍照</span>。
        </div>
      </div>

      <!-- 右欄：PDF 設定 -->
      <div id="settingsSection" class="lg:col-span-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 sm:p-6 shadow-sm space-y-4 sm:space-y-5 lg:sticky lg:top-24 transition-colors">
        <div class="border-b border-slate-100 dark:border-slate-800 pb-3.5">
          <h3 class="text-base font-bold text-slate-900 dark:text-white">PDF 設定</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">自訂版面、頁碼、尺寸與壓縮品質。</p>
        </div>

        <!-- 輸出檔案名稱 -->
        <div>
          <label for="pdfFilename" class="block text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">輸出檔案名稱</label>
          <div class="relative flex items-center">
            <input id="pdfFilename" type="text" value="合併文件" placeholder="合併文件" class="touch-btn w-full pl-3.5 pr-12 py-2.5 text-base sm:text-sm border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" />
            <span class="absolute right-3.5 text-xs font-semibold text-slate-400 dark:text-slate-500">.pdf</span>
          </div>
        </div>

        <!-- 頁碼設定 -->
        <div class="p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/70 dark:bg-slate-950/60 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <div>
              <span class="block text-xs font-bold text-slate-800 dark:text-slate-100">顯示頁碼</span>
              <span class="text-[11px] text-slate-500 dark:text-slate-400">在每頁右側角落加上 Page 1/3</span>
            </div>
            <button id="pageNumberToggle" type="button" role="switch" aria-checked="true" class="touch-btn inline-flex items-center gap-2 px-3 py-1.5 rounded-xl border border-indigo-500 bg-indigo-50 dark:bg-indigo-950/60 transition-all shrink-0">
              <span id="pageNumTrack" class="relative inline-flex h-5 w-9 shrink-0 items-center rounded-full bg-indigo-600 transition-colors duration-200">
                <span id="pageNumKnob" class="inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition-transform duration-200 translate-x-4"></span>
              </span>
              <span id="pageNumLabel" class="text-xs font-bold text-indigo-700 dark:text-indigo-300">開啟</span>
            </button>
          </div>

          <div id="pageNumFormatBox" class="pt-2 border-t border-slate-200/70 dark:border-slate-800 grid grid-cols-2 gap-2">
            <div>
              <label for="pageNumPosition" class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">頁碼位置</label>
              <select id="pageNumPosition" class="w-full px-2.5 py-2 text-xs font-medium border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="bottom_right" selected>右下角</option>
                <option value="top_right">右上角</option>
              </select>
            </div>
            <div>
              <label for="pageNumFormat" class="block text-[11px] font-semibold text-slate-500 dark:text-slate-400 mb-1">頁碼格式</label>
              <select id="pageNumFormat" class="w-full px-2.5 py-2 text-xs font-medium border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="page_slash" selected>Page 1/3</option>
                <option value="slash">1/3</option>
              </select>
            </div>
          </div>
        </div>

        <!-- 頁面尺寸與方向 -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3.5">
          <div>
            <label for="pageSize" class="block text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">頁面尺寸</label>
            <select id="pageSize" class="touch-btn w-full px-3.5 py-2.5 text-base sm:text-sm border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <option value="a4" selected>A4（210 × 297 毫米）</option>
              <option value="letter">美國信紙（8.5 × 11 吋）</option>
              <option value="fit">配合每張圖片原始尺寸</option>
            </select>
          </div>

          <div id="orientationGroup">
            <label class="block text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">頁面方向</label>
            <div class="grid grid-cols-2 gap-2">
              <button type="button" data-orientation="portrait" class="orientation-btn touch-btn active flex items-center justify-center gap-2 py-2.5 px-3 text-xs sm:text-sm font-medium border-2 border-indigo-600 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 rounded-xl transition-all">
                <span class="w-3 h-4 border-2 border-current rounded-[2px]"></span>
                直向
              </button>
              <button type="button" data-orientation="landscape" class="orientation-btn touch-btn flex items-center justify-center gap-2 py-2.5 px-3 text-xs sm:text-sm font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-all">
                <span class="w-4 h-3 border-2 border-current rounded-[2px]"></span>
                橫向
              </button>
            </div>
          </div>
        </div>

        <!-- 邊距 -->
        <div id="marginGroup">
          <label class="block text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">頁面邊距</label>
          <div class="grid grid-cols-3 gap-2">
            <button type="button" data-margin="0" class="margin-btn touch-btn py-2.5 px-2 text-xs sm:text-sm font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-all">
              無邊距
            </button>
            <button type="button" data-margin="10" class="margin-btn touch-btn active py-2.5 px-2 text-xs sm:text-sm font-medium border-2 border-indigo-600 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 rounded-xl transition-all">
              窄邊距
            </button>
            <button type="button" data-margin="20" class="margin-btn touch-btn py-2.5 px-2 text-xs sm:text-sm font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-all">
              標準
            </button>
          </div>
        </div>

        <!-- 圖片縮放 -->
        <div id="fitGroup">
          <label for="imageFit" class="block text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">圖片縮放方式</label>
          <select id="imageFit" class="touch-btn w-full px-3.5 py-2.5 text-base sm:text-sm border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="contain" selected>完整顯示圖片（不裁切）</option>
            <option value="cover">填滿整個頁面（裁切邊緣）</option>
          </select>
        </div>

        <!-- 壓縮品質 -->
        <div>
          <label for="imageQuality" class="block text-xs font-semibold tracking-wider text-slate-500 dark:text-slate-400 mb-1.5">圖片品質與檔案大小</label>
          <select id="imageQuality" class="touch-btn w-full px-3.5 py-2.5 text-base sm:text-sm border border-slate-300 dark:border-slate-700 rounded-xl bg-white dark:bg-slate-950 text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            <option value="0.85" selected>高畫質（建議手機使用）</option>
            <option value="0.65">中等畫質（檔案較小）</option>
            <option value="0.95">原始畫質（檔案較大）</option>
          </select>
        </div>

        <!-- 電腦版操作按鈕 -->
        <div class="hidden lg:block pt-2 space-y-2.5">
          <button id="convertBtn" type="button" disabled class="w-full py-3.5 px-4 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-300 dark:disabled:bg-slate-800 dark:disabled:text-slate-500 disabled:cursor-not-allowed rounded-xl shadow-sm flex items-center justify-center gap-2 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            <span id="convertBtnText">合併並下載 PDF</span>
          </button>

          <button id="desktopShareBtn" type="button" disabled class="w-full py-3 px-4 text-sm font-semibold text-indigo-700 dark:text-indigo-300 bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/60 dark:hover:bg-indigo-900/70 disabled:opacity-40 disabled:cursor-not-allowed rounded-xl flex items-center justify-center gap-2 transition-all">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">

              <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />

  <script>
    const { jsPDF } = window.jspdf;

    // 應用程式狀態
    let images = [];
    let selectedOrientation = 'portrait';
    let selectedMargin = 10;
    let showPageNumbers = true;
    let pageNumberPosition = 'bottom_right';
    let pageNumberFormat = 'page_slash';
    let isConverting = false;
    let lastGeneratedBlob = null;
    let lastGeneratedFilename = '合併文件.pdf';
    let sortableInstance = null;

    const canNativeShare = typeof navigator !== 'undefined' && typeof navigator.share === 'function';
    const isMobileDevice = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    // DOM 元素
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeToggleText = document.getElementById('themeToggleText');
    const themeColorMeta = document.getElementById('themeColorMeta');

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const cameraInput = document.getElementById('cameraInput');
    const browseBtn = document.getElementById('browseBtn');
    const cameraBtn = document.getElementById('cameraBtn');
    const addMoreBtn = document.getElementById('addMoreBtn');
    const clearAllBtn = document.getElementById('clearAllBtn');

    const pageNumberToggle = document.getElementById('pageNumberToggle');
    const pageNumTrack = document.getElementById('pageNumTrack');
    const pageNumKnob = document.getElementById('pageNumKnob');
    const pageNumLabel = document.getElementById('pageNumLabel');
    const pageNumFormatBox = document.getElementById('pageNumFormatBox');
    const pageNumPositionSelect = document.getElementById('pageNumPosition');
    const pageNumFormatSelect = document.getElementById('pageNumFormat');

    const convertBtn = document.getElementById('convertBtn');
    const convertBtnText = document.getElementById('convertBtnText');
    const headerConvertBtn = document.getElementById('headerConvertBtn');
    const headerCountBadge = document.getElementById('headerCountBadge');
    const mobileConvertBtn = document.getElementById('mobileConvertBtn');
    const mobileConvertText = document.getElementById('mobileConvertText');
    const mobileCountBadge = document.getElementById('mobileCountBadge');
    const mobileShareBtn = document.getElementById('mobileShareBtn');
    const desktopShareBtn = document.getElementById('desktopShareBtn');
    const scrollSettingsBtn = document.getElementById('scrollSettingsBtn');
    const settingsSection = document.getElementById('settingsSection');

    const workspaceHeader = document.getElementById('workspaceHeader');
    const imageGrid = document.getElementById('imageGrid');
    const imageCount = document.getElementById('imageCount');
    const emptyStateHint = document.getElementById('emptyStateHint');
    const pdfFilenameInput = document.getElementById('pdfFilename');
    const pageSizeSelect = document.getElementById('pageSize');
    const imageFitSelect = document.getElementById('imageFit');
    const imageQualitySelect = document.getElementById('imageQuality');
    const orientationGroup = document.getElementById('orientationGroup');
    const marginGroup = document.getElementById('marginGroup');
    const fitGroup = document.getElementById('fitGroup');
    const statusMessage = document.getElementById('statusMessage');

    // 分享視窗 DOM
    const shareModal = document.getElementById('shareModal');
    const closeShareModalBtn = document.getElementById('closeShareModalBtn');
    const shareWhatsAppBtn = document.getElementById('shareWhatsAppBtn');
    const shareDriveBtn = document.getElementById('shareDriveBtn');
    const shareNativeBtn = document.getElementById('shareNativeBtn');
    const shareDownloadBtn = document.getElementById('shareDownloadBtn');

    if (canNativeShare) {
      shareNativeBtn.classList.remove('hidden');
    }

    // =========================================================================
    // 深淺色模式切換（預設深色）
    // =========================================================================
    function syncThemeUI() {
      const isDark = document.documentElement.classList.contains('dark');
      themeToggleText.textContent = isDark ? '淺色模式' : '深色模式';
      themeToggleBtn.title = isDark ? '切換為淺色模式' : '切換為深色模式';
      themeColorMeta.setAttribute('content', isDark ? '#0f172a' : '#4f46e5');
    }

    themeToggleBtn.addEventListener('click', () => {
      const isNowDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('pdfmerge_theme', isNowDark ? 'dark' : 'light');
      syncThemeUI();
    });

    syncThemeUI();

    // =========================================================================
    // 右上角頁碼設定
    // =========================================================================
    function syncPageNumberUI() {
      pageNumberToggle.setAttribute('aria-checked', String(showPageNumbers));
      if (showPageNumbers) {
        pageNumberToggle.className = 'touch-btn inline-flex items-center gap-2 px-3 py-1.5 rounded-xl border border-indigo-500 bg-indigo-50 dark:bg-indigo-950/60 transition-all shrink-0';
        pageNumTrack.className = 'relative inline-flex h-5 w-9 shrink-0 items-center rounded-full bg-indigo-600 transition-colors duration-200';
        pageNumKnob.className = 'inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition-transform duration-200 translate-x-4';
        pageNumLabel.textContent = '開啟';
        pageNumLabel.className = 'text-xs font-bold text-indigo-700 dark:text-indigo-300';
        pageNumFormatBox.classList.remove('hidden');
      } else {
        pageNumberToggle.className = 'touch-btn inline-flex items-center gap-2 px-3 py-1.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 transition-all shrink-0';
        pageNumTrack.className = 'relative inline-flex h-5 w-9 shrink-0 items-center rounded-full bg-slate-300 dark:bg-slate-700 transition-colors duration-200';
        pageNumKnob.className = 'inline-block h-3.5 w-3.5 transform rounded-full bg-white shadow transition-transform duration-200 translate-x-1';
        pageNumLabel.textContent = '關閉';
        pageNumLabel.className = 'text-xs font-bold text-slate-600 dark:text-slate-400';
        pageNumFormatBox.classList.add('hidden');
      }
    }

    pageNumberToggle.addEventListener('click', () => {
      showPageNumbers = !showPageNumbers;
      syncPageNumberUI();
      invalidatePdfCache();
      renderGrid();
    });

    pageNumPositionSelect.addEventListener('change', () => {
      pageNumberPosition = pageNumPositionSelect.value;
      invalidatePdfCache();
      renderGrid();
    });

    pageNumFormatSelect.addEventListener('change', () => {
      pageNumberFormat = pageNumFormatSelect.value;
      invalidatePdfCache();
      renderGrid();
    });

    syncPageNumberUI();

    // =========================================================================
    // 拖曳排序
    // =========================================================================
    function initSortable() {
      if (sortableInstance) sortableInstance.destroy();
      sortableInstance = new Sortable(imageGrid, {
        animation: 180,
        handle: '.drag-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        delay: 80,
        delayOnTouchOnly: true,
        touchStartThreshold: 4,
        onEnd: function (evt) {
          const oldIndex = evt.oldIndex;
          const newIndex = evt.newIndex;
          if (oldIndex !== undefined && newIndex !== undefined && oldIndex !== newIndex) {
            const [moved] = images.splice(oldIndex, 1);
            images.splice(newIndex, 0, moved);
            invalidatePdfCache();
            renderGrid();
          }
        }
      });
    }

    // =========================================================================
    // 檔案上傳事件
    // =========================================================================
    browseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      fileInput.click();
    });
    cameraBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      cameraInput.click();
    });
    addMoreBtn.addEventListener('click', () => fileInput.click());

    dropZone.addEventListener('click', (e) => {
      if (!e.target.closest('button')) fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
      fileInput.value = '';
    });

    cameraInput.addEventListener('change', (e) => {
      handleFiles(e.target.files);
      cameraInput.value = '';
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      handleFiles(e.dataTransfer.files);
    });

    scrollSettingsBtn.addEventListener('click', () => {
      settingsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    clearAllBtn.addEventListener('click', () => {
      images = [];
      invalidatePdfCache();
      renderGrid();
      showStatus('已清除所有圖片。', 'info');
    });

    // =========================================================================
    // PDF 版面設定
    // =========================================================================
    document.querySelectorAll('.orientation-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedOrientation = btn.dataset.orientation;
        document.querySelectorAll('.orientation-btn').forEach((b) => {
          const active = b.dataset.orientation === selectedOrientation;
          b.className = active
            ? 'orientation-btn touch-btn active flex items-center justify-center gap-2 py-2.5 px-3 text-xs sm:text-sm font-medium border-2 border-indigo-600 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 rounded-xl transition-all'
            : 'orientation-btn touch-btn flex items-center justify-center gap-2 py-2.5 px-3 text-xs sm:text-sm font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-all';
        });
        invalidatePdfCache();
      });
    });

    document.querySelectorAll('.margin-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        selectedMargin = Number(btn.dataset.margin);
        document.querySelectorAll('.margin-btn').forEach((b) => {
          const active = Number(b.dataset.margin) === selectedMargin;
          b.className = active
            ? 'margin-btn touch-btn active py-2.5 px-2 text-xs sm:text-sm font-medium border-2 border-indigo-600 bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 rounded-xl transition-all'
            : 'margin-btn touch-btn py-2.5 px-2 text-xs sm:text-sm font-medium border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-xl transition-all';
        });
        invalidatePdfCache();
      });
    });

    function syncPageSizeControls() {
      const isFit = pageSizeSelect.value === 'fit';
      orientationGroup.classList.toggle('hidden', isFit);
      marginGroup.classList.toggle('hidden', isFit);
      fitGroup.classList.toggle('hidden', isFit);
      invalidatePdfCache();
    }

    pageSizeSelect.addEventListener('change', syncPageSizeControls);
    imageFitSelect.addEventListener('change', invalidatePdfCache);
    imageQualitySelect.addEventListener('change', invalidatePdfCache);
    pdfFilenameInput.addEventListener('input', invalidatePdfCache);

    // =========================================================================
    // 圖片載入與預覽格線
    // =========================================================================
    function invalidatePdfCache() {
      lastGeneratedBlob = null;
      mobileShareBtn.disabled = images.length === 0 || isConverting;
      desktopShareBtn.disabled = images.length === 0 || isConverting;
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function loadImageMetadata(dataUrl) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
        img.onerror = reject;
        img.src = dataUrl;
      });
    }

    async function handleFiles(fileList) {
      const files = Array.from(fileList).filter((file) => file.type.startsWith('image/'));
      if (files.length === 0) {
        showStatus('請選擇有效的圖片檔案（JPG、PNG、WebP）。', 'error');
        return;
      }

      showStatus(`正在載入 ${files.length} 張圖片...`, 'info');

      for (const file of files) {
        try {
          const dataUrl = await readFileAsDataURL(file);
          const imgMeta = await loadImageMetadata(dataUrl);
          images.push({
            id: 'img_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
            name: file.name,
            dataUrl,
            rotation: 0,
            width: imgMeta.width,
            height: imgMeta.height
          });
        } catch (err) {
          console.error('載入圖片失敗:', err);
        }
      }

      invalidatePdfCache();
      renderGrid();
      showStatus(`已加入 ${files.length} 張圖片。`, 'success');
    }

    function updatePdfPageCount() {
      const hasImages = images.length > 0;
      const totalPdfPages = images.length;

      convertBtn.disabled = !hasImages || isConverting;
      headerConvertBtn.disabled = !hasImages || isConverting;
      mobileConvertBtn.disabled = !hasImages || isConverting;
      mobileShareBtn.disabled = !hasImages || isConverting;
      desktopShareBtn.disabled = !hasImages || isConverting;

      if (hasImages) {
        headerCountBadge.textContent = totalPdfPages;
        headerCountBadge.classList.remove('hidden');
        mobileCountBadge.textContent = totalPdfPages;
        mobileCountBadge.classList.remove('hidden');
        convertBtnText.textContent = `合併 ${totalPdfPages} 頁並下載 PDF`;
        mobileConvertText.textContent = '建立 PDF';
      } else {
        headerCountBadge.classList.add('hidden');
        mobileCountBadge.classList.add('hidden');
        convertBtnText.textContent = '合併並下載 PDF';
        mobileConvertText.textContent = '建立 PDF';
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[m]));
    }

    function renderGrid() {
      const hasImages = images.length > 0;
      workspaceHeader.classList.toggle('hidden', !hasImages);
      clearAllBtn.classList.toggle('hidden', !hasImages);
      emptyStateHint.classList.toggle('hidden', hasImages);
      imageCount.textContent = images.length;

      imageGrid.innerHTML = '';

      images.forEach((item, index) => {
        const card = document.createElement('div');
        card.dataset.id = item.id;
        card.className = 'group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm hover:border-indigo-300 dark:hover:border-indigo-700 transition-all animate-fade-in flex flex-col';

        card.innerHTML = `
          <div class="relative aspect-[4/3] bg-slate-100 dark:bg-slate-950 flex items-center justify-center overflow-hidden p-2">
            <img
              src="${item.dataUrl}"
              alt="${escapeHtml(item.name)}"
              class="max-w-full max-h-full object-contain transition-transform duration-200 select-none pointer-events-none"
              style="transform: rotate(${item.rotation}deg);"
            />
            <span class="absolute top-2 left-2 bg-slate-900/80 text-white text-[11px] font-bold px-2 py-0.5 rounded-lg backdrop-blur-xs">
              第 ${index + 1} 頁
            </span>
            ${showPageNumbers ? `<span class="absolute ${pageNumberPosition === 'top_right' ? 'top-2 right-12' : 'bottom-2 right-2'} bg-white/95 text-slate-900 border border-slate-300 text-[10px] font-semibold px-1.5 py-0.5 rounded shadow-xs pointer-events-none">${pageNumberFormat === 'slash' ? `${index + 1}/${images.length}` : `Page ${index + 1}/${images.length}`}</span>` : ''}
            <button
              type="button"
              class="drag-handle absolute top-2 right-2 w-8 h-8 rounded-lg bg-white/90 dark:bg-slate-800/90 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 flex items-center justify-center cursor-grab active:cursor-grabbing shadow-xs"
              title="按住拖曳排序"
              aria-label="按住拖曳排序"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 8h16M4 16h16" />
              </svg>
            </button>
          </div>

          <div class="p-3 flex items-center justify-between gap-2 border-t border-slate-100 dark:border-slate-800">
            <div class="min-w-0">
              <p class="text-xs font-semibold text-slate-800 dark:text-slate-100 truncate" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</p>
              <p class="text-[11px] text-slate-400 dark:text-slate-500 mt-0.5">${item.width} × ${item.height}px${item.rotation ? ` • 旋轉 ${item.rotation}°` : ''}</p>
            </div>

            <div class="flex items-center gap-1 shrink-0">
              <button
                type="button"
                data-action="rotate"
                data-id="${item.id}"
                class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-indigo-50 dark:bg-slate-800 dark:hover:bg-indigo-950/70 text-slate-600 hover:text-indigo-600 dark:text-slate-300 dark:hover:text-indigo-400 flex items-center justify-center transition-colors"
                title="順時針旋轉 90°"
                aria-label="順時針旋轉 90 度"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
              </button>

              <button
                type="button"
                data-action="delete"
                data-id="${item.id}"
                class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-rose-50 dark:bg-slate-800 dark:hover:bg-rose-950/60 text-slate-600 hover:text-rose-600 dark:text-slate-300 dark:hover:text-rose-400 flex items-center justify-center transition-colors"
                title="移除此頁"
                aria-label="移除此頁"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
              </button>
            </div>
          </div>
        `;

        imageGrid.appendChild(card);
      });

      initSortable();
      updatePdfPageCount();
    }

    imageGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const { action, id } = btn.dataset;
      const idx = images.findIndex((i) => i.id === id);
      if (idx === -1) return;

      if (action === 'rotate') {
        images[idx].rotation = (images[idx].rotation + 90) % 360;
        invalidatePdfCache();
        renderGrid();
      } else if (action === 'delete') {
        images.splice(idx, 1);
        invalidatePdfCache();
        renderGrid();
      }
    });

    // =========================================================================
    // PDF 產生與右上角頁碼繪製
    // =========================================================================
    function renderRotatedImageForPdf(item, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = quality >= 0.95 ? 4000 : quality >= 0.85 ? 2400 : 1600;
          let srcW = img.naturalWidth;
          let srcH = img.naturalHeight;

          if (srcW > maxDim || srcH > maxDim) {
            const scale = maxDim / Math.max(srcW, srcH);
            srcW = Math.round(srcW * scale);
            srcH = Math.round(srcH * scale);
          }

          const rot = item.rotation % 360;
          const swap = rot === 90 || rot === 270;
          const canvasW = swap ? srcH : srcW;
          const canvasH = swap ? srcW : srcH;

          const canvas = document.createElement('canvas');
          canvas.width = canvasW;
          canvas.height = canvasH;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvasW, canvasH);

          ctx.translate(canvasW / 2, canvasH / 2);
          ctx.rotate((rot * Math.PI) / 180);
          ctx.drawImage(img, -srcW / 2, -srcH / 2, srcW, srcH);

          const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
          canvas.width = 0;
          canvas.height = 0;

          resolve({ dataUrl: jpegDataUrl, width: canvasW, height: canvasH });
        };
        img.onerror = reject;
        img.src = item.dataUrl;
      });
    }

    function drawCornerPageNumber(doc, pageIndex, totalPages, pageW, pageH) {
      const label = pageNumberFormat === 'slash'
        ? `${pageIndex}/${totalPages}`
        : `Page ${pageIndex}/${totalPages}`;

      // 依頁面實際尺寸自動調整字體大小（確保原始圖片尺寸模式也清晰可見）
      const fontSize = Math.max(10, Math.round(Math.min(pageW, pageH) * 0.055));
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(fontSize);

      const textW = doc.getTextWidth(label);
      const textH = fontSize * 0.352778;
      const padX = Math.max(2, textH * 0.5);
      const padY = Math.max(1.2, textH * 0.3);
      const edgeX = Math.max(5, Math.min(10, pageW * 0.03));
      const edgeY = Math.max(5, Math.min(10, pageH * 0.025));

      const boxW = textW + padX * 2;
      const boxH = textH + padY * 2;
      const boxX = pageW - edgeX - boxW;
      const boxY = pageNumberPosition === 'top_right'
        ? edgeY
        : pageH - edgeY - boxH;

      // 白色底框確保深色圖片上頁碼依然清晰可讀
      doc.setFillColor(255, 255, 255);
      doc.roundedRect(boxX, boxY, boxW, boxH, 1.2, 1.2, 'F');

      doc.setTextColor(15, 23, 42);
      const textBaselineY = boxY + padY + textH * 0.82;
      doc.text(label, boxX + boxW - padX, textBaselineY, { align: 'right' });
    }

    function getSanitizedFilename() {
      const raw = (pdfFilenameInput.value || '合併文件').trim();
      const cleaned = raw.replace(/[<>:"/\\|?*]+/g, '-').replace(/\.pdf$/i, '') || '合併文件';
      return `${cleaned}.pdf`;
    }

    async function buildPdfBlob() {
      const pageSize = pageSizeSelect.value;
      const imageFit = imageFitSelect.value;
      const quality = parseFloat(imageQualitySelect.value) || 0.85;
      const margin = selectedMargin;
      const totalPages = images.length;

      let doc = null;

      for (let i = 0; i < totalPages; i++) {
        showStatus(`正在處理第 ${i + 1} / ${totalPages} 頁...`, 'info');
        const rendered = await renderRotatedImageForPdf(images[i], quality);

        let pageW, pageH;

        if (pageSize === 'fit') {
          const pxToMm = 25.4 / 96;
          pageW = Math.max(20, rendered.width * pxToMm);
          pageH = Math.max(20, rendered.height * pxToMm);
          const orient = pageW >= pageH ? 'l' : 'p';

          if (!doc) {
            doc = new jsPDF({ orientation: orient, unit: 'mm', format: [pageW, pageH], compress: true });
          } else {
            doc.addPage([pageW, pageH], orient);
          }

          doc.addImage(rendered.dataUrl, 'JPEG', 0, 0, pageW, pageH, undefined, 'FAST');
        } else {
          const orient = selectedOrientation === 'landscape' ? 'l' : 'p';
          if (!doc) {
            doc = new jsPDF({ orientation: orient, unit: 'mm', format: pageSize, compress: true });
          } else {
            doc.addPage(pageSize, orient);
          }

          pageW = doc.internal.pageSize.getWidth();
          pageH = doc.internal.pageSize.getHeight();
          const topMargin = (showPageNumbers && pageNumberPosition === 'top_right') ? Math.max(margin, 14) : margin;
          const bottomMargin = (showPageNumbers && pageNumberPosition === 'bottom_right') ? Math.max(margin, 14) : margin;
          const availW = Math.max(10, pageW - margin * 2);
          const availH = Math.max(10, pageH - topMargin - bottomMargin);

          const imgRatio = rendered.width / rendered.height;
          const boxRatio = availW / availH;

          let drawW, drawH, offsetX, offsetY;

          if (imageFit === 'cover') {
            if (imgRatio > boxRatio) {
              drawH = availH;
              drawW = drawH * imgRatio;
            } else {
              drawW = availW;
              drawH = drawW / imgRatio;
            }
            offsetX = margin + (availW - drawW) / 2;
            offsetY = topMargin + (availH - drawH) / 2;
          } else {
            if (imgRatio > boxRatio) {
              drawW = availW;
              drawH = drawW / imgRatio;
            } else {
              drawH = availH;
              drawW = drawH * imgRatio;
            }
            offsetX = margin + (availW - drawW) / 2;
            offsetY = topMargin + (availH - drawH) / 2;
          }

          doc.addImage(rendered.dataUrl, 'JPEG', offsetX, offsetY, drawW, drawH, undefined, 'FAST');
        }

        if (showPageNumbers) {
          drawCornerPageNumber(doc, i + 1, totalPages, pageW, pageH);
        }
      }

      const filename = getSanitizedFilename();
      const blob = doc.output('blob');
      lastGeneratedBlob = blob;
      lastGeneratedFilename = filename;
      return { blob, filename };
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
    }

    async function ensurePdfReady() {
      if (lastGeneratedBlob) {
        return { blob: lastGeneratedBlob, filename: lastGeneratedFilename };
      }
      return await buildPdfBlob();
    }

    async function handleConvertAndDownload() {
      if (images.length === 0 || isConverting) return;
      isConverting = true;
      updatePdfPageCount();

      try {
        const { blob, filename } = await buildPdfBlob();
        triggerDownload(blob, filename);
        showStatus(`已下載「${filename}」（共 ${images.length} 頁）。`, 'success');
      } catch (err) {
        console.error('建立 PDF 失敗:', err);
        showStatus('建立 PDF 失敗，請嘗試降低圖片品質後重試。', 'error');
      } finally {
        isConverting = false;
        updatePdfPageCount();
      }
    }

    // =========================================================================
    // 分享功能（WhatsApp / Google Drive / 系統原生分享）
    // =========================================================================
    function openShareModal() {
      if (images.length === 0 || isConverting) return;
      shareModal.classList.remove('hidden');
    }

    function closeShareModal() {
      shareModal.classList.add('hidden');
    }

    closeShareModalBtn.addEventListener('click', closeShareModal);
    shareModal.addEventListener('click', (e) => {
      if (e.target === shareModal) closeShareModal();
    });

    async function tryNativeFileShare(blob, filename, shareText) {
      if (!canNativeShare) return false;
      const file = new File([blob], filename, { type: 'application/pdf' });
      if (navigator.canShare && !navigator.canShare({ files: [file] })) {
        return false;
      }
      await navigator.share({
        title: filename,
        text: shareText,
        files: [file]
      });
      return true;
    }

    async function executeShare(target) {
      if (images.length === 0 || isConverting) return;
      isConverting = true;
      updatePdfPageCount();
      closeShareModal();

      // 電腦版先同步開啟分頁，避免非同步產生 PDF 後被瀏覽器封鎖彈出視窗
      let targetPopup = null;
      if (!isMobileDevice && (target === 'drive' || target === 'whatsapp')) {
        targetPopup = window.open('about:blank', '_blank');
      }

      try {
        const { blob, filename } = await ensurePdfReady();

        if (target === 'download') {
          triggerDownload(blob, filename);
          showStatus(`已下載「${filename}」。`, 'success');
          return;
        }

        if (target === 'native') {
          const shared = await tryNativeFileShare(blob, filename, `分享 PDF：${filename}`);
          if (shared) {
            showStatus('已開啟系統分享選單。', 'success');
          } else {
            triggerDownload(blob, filename);
            showStatus('此瀏覽器不支援直接分享檔案，已自動下載 PDF。', 'info');
          }
          return;
        }

        if (target === 'whatsapp') {
          if (isMobileDevice) {
            const shared = await tryNativeFileShare(blob, filename, `請於選單選擇 WhatsApp 傳送「${filename}」`);
            if (shared) {
              showStatus('已透過系統選單分享至 WhatsApp。', 'success');
              return;
            }
          }
          triggerDownload(blob, filename);
          const waUrl = isMobileDevice
            ? `https://wa.me/?text=${encodeURIComponent(`已建立 PDF 檔案：${filename}`)}`
            : 'https://web.whatsapp.com/';
          if (targetPopup && !targetPopup.closed) {
            targetPopup.location.href = waUrl;
          } else {
            window.open(waUrl, '_blank', 'noopener,noreferrer');
          }
          showStatus(`已下載「${filename}」並開啟 WhatsApp，請將檔案拖曳或附加傳送。`, 'success');
          return;
        }

        if (target === 'drive') {
          if (isMobileDevice) {
            const shared = await tryNativeFileShare(blob, filename, `請於選單選擇 Google Drive 儲存「${filename}」`);
            if (shared) {
              showStatus('已透過系統選單儲存至 Google Drive。', 'success');
              return;
            }
          }
          triggerDownload(blob, filename);
          const driveUrl = 'https://drive.google.com/drive/my-drive';
          if (targetPopup && !targetPopup.closed) {
            targetPopup.location.href = driveUrl;
          } else {
            window.open(driveUrl, '_blank', 'noopener,noreferrer');
          }
          showStatus(`已下載「${filename}」並開啟 Google Drive，請將檔案拖曳至頁面內上傳。`, 'success');
        }
      } catch (err) {
        if (targetPopup && !targetPopup.closed) {
          targetPopup.close();
        }
        if (err && err.name !== 'AbortError') {
          console.error('分享失敗:', err);
          showStatus('分享失敗，請改用直接下載功能。', 'error');
        }
      } finally {
        isConverting = false;
        updatePdfPageCount();
      }
    }

    convertBtn.addEventListener('click', handleConvertAndDownload);
    headerConvertBtn.addEventListener('click', handleConvertAndDownload);
    mobileConvertBtn.addEventListener('click', handleConvertAndDownload);

    mobileShareBtn.addEventListener('click', openShareModal);
    desktopShareBtn.addEventListener('click', openShareModal);

    shareWhatsAppBtn.addEventListener('click', () => executeShare('whatsapp'));
    shareDriveBtn.addEventListener('click', () => executeShare('drive'));
    shareNativeBtn.addEventListener('click', () => executeShare('native'));
    shareDownloadBtn.addEventListener('click', () => executeShare('download'));

    // =========================================================================
    // 狀態提示列
    // =========================================================================
    let statusTimer = null;
    function showStatus(text, type = 'info') {
      statusMessage.textContent = text;
      statusMessage.classList.remove('hidden');
      if (type === 'error') {
        statusMessage.className = 'text-xs font-medium text-center py-2.5 px-3 rounded-xl bg-rose-50 dark:bg-rose-950/60 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800';
      } else if (type === 'success') {
        statusMessage.className = 'text-xs font-medium text-center py-2.5 px-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800';
      } else {
        statusMessage.className = 'text-xs font-medium text-center py-2.5 px-3 rounded-xl bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 border border-indigo-200 dark:border-indigo-800';
      }

      if (statusTimer) clearTimeout(statusTimer);
      statusTimer = setTimeout(() => {
        statusMessage.classList.add('hidden');
      }, 5000);
    }

    syncPageSizeControls();
    renderGrid();
  </script>
</body>
