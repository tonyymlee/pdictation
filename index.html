<!DOCTYPE html>
<html lang="zh-Hant" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學趣味學習樂園 | Fun Primary School Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Fredoka & Poppins for playful kids style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Fredoka"', '"Poppins"', 'sans-serif'],
                    },
                    colors: {
                        fun: {
                            pink: '#FF6B6B',
                            orange: '#FFA502',
                            yellow: '#FFD32A',
                            green: '#2ED573',
                            blue: '#1E90FF',
                            purple: '#9B59B6'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', 'Poppins', sans-serif;
            background-color: #F8F9FD;
            background-image: 
                radial-gradient(#FF6B6B 1.5px, transparent 1.5px), 
                radial-gradient(#1E90FF 1.5px, #F8F9FD 1.5px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }
        /* Playful bounce & hover effect */
        .card-bounce {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card-bounce:hover {
            transform: translateY(-12px) rotate(1deg) scale(1.03);
        }
        /* Floating animation for decorative elements */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen text-slate-700 flex flex-col justify-between selection:bg-pink-400 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b-4 border-slate-100 shadow-sm">
        <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-pink-500 to-yellow-400 flex items-center justify-center text-white shadow-lg shadow-pink-200 animate-float">
                    <i data-lucide="rocket" class="w-7 h-7"></i>
                </div>
                <div>
                    <span class="font-bold text-2xl tracking-wide bg-gradient-to-r from-pink-500 via-purple-500 to-blue-500 bg-clip-text text-transparent block leading-tight">學習百寶箱</span>
                    <span class="text-xs font-semibold text-slate-400 tracking-wider">FUN LEARNING WORLD</span>
                </div>
            </div>
            <button onclick="openRandomCard()" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-pink-500 to-orange-400 text-white font-bold text-base shadow-lg shadow-pink-200 hover:shadow-xl hover:scale-105 active:scale-95 transition-all flex items-center space-x-2">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <span>隨機抽抽樂！</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto px-6 py-12 w-full">
        <div class="text-center mb-12">
            <span class="inline-block px-5 py-2 rounded-full bg-yellow-100 text-yellow-700 font-bold text-sm shadow-sm border-2 border-yellow-300 mb-4 animate-bounce">
                ✨ 選擇你的冒險學科！ ✨
            </span>
            <h1 class="text-4xl sm:text-5xl font-extrabold text-slate-800 tracking-tight">
                今天想探索哪一個世界呢？
            </h1>
        </div>

        <!-- 6 Colorful Subject Cards Grid (No descriptive paragraphs) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">

            <!-- 1. 中文 (Chinese) - Red/Pink Theme -->
            <div onclick="openCardModal('chinese')" class="card-bounce bg-white rounded-3xl p-8 border-4 border-pink-400 shadow-xl shadow-pink-100 flex flex-col items-center justify-between cursor-pointer relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 w-28 h-28 bg-pink-100 rounded-full group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>
                <div class="w-20 h-20 rounded-2xl bg-pink-500 text-white flex items-center justify-center shadow-lg shadow-pink-300 group-hover:rotate-12 transition-transform mb-4">
                    <i data-lucide="book-open" class="w-10 h-10"></i>
                </div>
                <div class="text-center w-full">
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-pink-100 text-pink-600 uppercase tracking-widest">語文天地</span>
                    <h2 class="text-3xl font-extrabold text-slate-800 mt-2">中文</h2>
                    <p class="text-sm font-semibold text-pink-400 tracking-wide mt-1">Chinese</p>
                    
                    <!-- Styled Hyphen / Divider Line -->
                    <div class="my-6 flex items-center justify-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-pink-300"></div>
                        <div class="w-12 h-1.5 rounded-full bg-pink-400"></div>
                        <div class="w-4 h-4 rounded-full bg-pink-500"></div>
                        <div class="w-12 h-1.5 rounded-full bg-pink-400"></div>
                        <div class="w-3 h-3 rounded-full bg-pink-300"></div>
                    </div>
                </div>
                <div class="w-full py-3 rounded-2xl bg-pink-50 text-pink-600 font-bold text-sm text-center group-hover:bg-pink-500 group-hover:text-white transition-colors shadow-sm">
                    點擊探索 🚀
                </div>
            </div>

            <!-- 2. 英文 (English) - Blue Theme -->
            <div onclick="openCardModal('english')" class="card-bounce bg-white rounded-3xl p-8 border-4 border-blue-400 shadow-xl shadow-blue-100 flex flex-col items-center justify-between cursor-pointer relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 w-28 h-28 bg-blue-100 rounded-full group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>
                <div class="w-20 h-20 rounded-2xl bg-blue-500 text-white flex items-center justify-center shadow-lg shadow-blue-300 group-hover:rotate-12 transition-transform mb-4">
                    <i data-lucide="globe-2" class="w-10 h-10"></i>
                </div>
                <div class="text-center w-full">
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-blue-100 text-blue-600 uppercase tracking-widest">國際語言</span>
                    <h2 class="text-3xl font-extrabold text-slate-800 mt-2">英文</h2>
                    <p class="text-sm font-semibold text-blue-400 tracking-wide mt-1">English</p>
                    
                    <!-- Styled Hyphen / Divider Line -->
                    <div class="my-6 flex items-center justify-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-blue-300"></div>
                        <div class="w-12 h-1.5 rounded-full bg-blue-400"></div>
                        <div class="w-4 h-4 rounded-full bg-blue-500"></div>
                        <div class="w-12 h-1.5 rounded-full bg-blue-400"></div>
                        <div class="w-3 h-3 rounded-full bg-blue-300"></div>
                    </div>
                </div>
                <div class="w-full py-3 rounded-2xl bg-blue-50 text-blue-600 font-bold text-sm text-center group-hover:bg-blue-500 group-hover:text-white transition-colors shadow-sm">
                    點擊探索 🚀
                </div>
            </div>

            <!-- 3. 數學 (Mathematics) - Green Theme -->
            <div onclick="openCardModal('math')" class="card-bounce bg-white rounded-3xl p-8 border-4 border-emerald-400 shadow-xl shadow-emerald-100 flex flex-col items-center justify-between cursor-pointer relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 w-28 h-28 bg-emerald-100 rounded-full group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>
                <div class="w-20 h-20 rounded-2xl bg-emerald-500 text-white flex items-center justify-center shadow-lg shadow-emerald-300 group-hover:rotate-12 transition-transform mb-4">
                    <i data-lucide="calculator" class="w-10 h-10"></i>
                </div>
                <div class="text-center w-full">
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-emerald-100 text-emerald-600 uppercase tracking-widest">邏輯數理</span>
                    <h2 class="text-3xl font-extrabold text-slate-800 mt-2">數學</h2>
                    <p class="text-sm font-semibold text-emerald-400 tracking-wide mt-1">Mathematics</p>
                    
                    <!-- Styled Hyphen / Divider Line -->
                    <div class="my-6 flex items-center justify-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-emerald-300"></div>
                        <div class="w-12 h-1.5 rounded-full bg-emerald-400"></div>
                        <div class="w-4 h-4 rounded-full bg-emerald-500"></div>
                        <div class="w-12 h-1.5 rounded-full bg-emerald-400"></div>
                        <div class="w-3 h-3 rounded-full bg-emerald-300"></div>
                    </div>
                </div>
                <div class="w-full py-3 rounded-2xl bg-emerald-50 text-emerald-600 font-bold text-sm text-center group-hover:bg-emerald-500 group-hover:text-white transition-colors shadow-sm">
                    點擊探索 🚀
                </div>
            </div>

            <!-- 4. 人文 (Humanities) - Orange Theme -->
            <div onclick="openCardModal('humanities')" class="card-bounce bg-white rounded-3xl p-8 border-4 border-orange-400 shadow-xl shadow-orange-100 flex flex-col items-center justify-between cursor-pointer relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 w-28 h-28 bg-orange-100 rounded-full group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>
                <div class="w-20 h-20 rounded-2xl bg-orange-500 text-white flex items-center justify-center shadow-lg shadow-orange-300 group-hover:rotate-12 transition-transform mb-4">
                    <i data-lucide="landmark" class="w-10 h-10"></i>
                </div>
                <div class="text-center w-full">
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-orange-100 text-orange-600 uppercase tracking-widest">社會人文</span>
                    <h2 class="text-3xl font-extrabold text-slate-800 mt-2">人文</h2>
                    <p class="text-sm font-semibold text-orange-400 tracking-wide mt-1">Humanities</p>
                    
                    <!-- Styled Hyphen / Divider Line -->
                    <div class="my-6 flex items-center justify-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-orange-300"></div>
                        <div class="w-12 h-1.5 rounded-full bg-orange-400"></div>
                        <div class="w-4 h-4 rounded-full bg-orange-500"></div>
                        <div class="w-12 h-1.5 rounded-full bg-orange-400"></div>
                        <div class="w-3 h-3 rounded-full bg-orange-300"></div>
                    </div>
                </div>
                <div class="w-full py-3 rounded-2xl bg-orange-50 text-orange-600 font-bold text-sm text-center group-hover:bg-orange-500 group-hover:text-white transition-colors shadow-sm">
                    點擊探索 🚀
                </div>
            </div>

            <!-- 5. 科學 (Science) - Cyan/Teal Theme -->
            <div onclick="openCardModal('science')" class="card-bounce bg-white rounded-3xl p-8 border-4 border-cyan-400 shadow-xl shadow-cyan-100 flex flex-col items-center justify-between cursor-pointer relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 w-28 h-28 bg-cyan-100 rounded-full group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>
                <div class="w-20 h-20 rounded-2xl bg-cyan-500 text-white flex items-center justify-center shadow-lg shadow-cyan-300 group-hover:rotate-12 transition-transform mb-4">
                    <i data-lucide="flask-conical" class="w-10 h-10"></i>
                </div>
                <div class="text-center w-full">
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-cyan-100 text-cyan-600 uppercase tracking-widest">自然科學</span>
                    <h2 class="text-3xl font-extrabold text-slate-800 mt-2">科學</h2>
                    <p class="text-sm font-semibold text-cyan-400 tracking-wide mt-1">Science</p>
                    
                    <!-- Styled Hyphen / Divider Line -->
                    <div class="my-6 flex items-center justify-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-cyan-300"></div>
                        <div class="w-12 h-1.5 rounded-full bg-cyan-400"></div>
                        <div class="w-4 h-4 rounded-full bg-cyan-500"></div>
                        <div class="w-12 h-1.5 rounded-full bg-cyan-400"></div>
                        <div class="w-3 h-3 rounded-full bg-cyan-300"></div>
                    </div>
                </div>
                <div class="w-full py-3 rounded-2xl bg-cyan-50 text-cyan-600 font-bold text-sm text-center group-hover:bg-cyan-500 group-hover:text-white transition-colors shadow-sm">
                    點擊探索 🚀
                </div>
            </div>

            <!-- 6. 音樂 (Music) - Purple Theme -->
            <div onclick="openCardModal('music')" class="card-bounce bg-white rounded-3xl p-8 border-4 border-purple-400 shadow-xl shadow-purple-100 flex flex-col items-center justify-between cursor-pointer relative overflow-hidden group">
                <div class="absolute -top-10 -right-10 w-28 h-28 bg-purple-100 rounded-full group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>
                <div class="w-20 h-20 rounded-2xl bg-purple-500 text-white flex items-center justify-center shadow-lg shadow-purple-300 group-hover:rotate-12 transition-transform mb-4">
                    <i data-lucide="music-2" class="w-10 h-10"></i>
                </div>
                <div class="text-center w-full">
                    <span class="text-xs font-bold px-3 py-1 rounded-full bg-purple-100 text-purple-600 uppercase tracking-widest">藝術音韻</span>
                    <h2 class="text-3xl font-extrabold text-slate-800 mt-2">音樂</h2>
                    <p class="text-sm font-semibold text-purple-400 tracking-wide mt-1">Music</p>
                    
                    <!-- Styled Hyphen / Divider Line -->
                    <div class="my-6 flex items-center justify-center space-x-2">
                        <div class="w-3 h-3 rounded-full bg-purple-300"></div>
                        <div class="w-12 h-1.5 rounded-full bg-purple-400"></div>
                        <div class="w-4 h-4 rounded-full bg-purple-500"></div>
                        <div class="w-12 h-1.5 rounded-full bg-purple-400"></div>
                        <div class="w-3 h-3 rounded-full bg-purple-300"></div>
                    </div>
                </div>
                <div class="w-full py-3 rounded-2xl bg-purple-50 text-purple-600 font-bold text-sm text-center group-hover:bg-purple-500 group-hover:text-white transition-colors shadow-sm">
                    點擊探索 🚀
                </div>
            </div>

        </div>
    </main>

    <!-- Fun Popup Modal (Zero Boring Text, Pure Joy/Game UI) -->
    <div id="funModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div id="modalCard" class="bg-white rounded-3xl max-w-sm w-full mx-4 p-8 shadow-2xl transform scale-75 transition-all duration-300 relative border-4 border-yellow-300 text-center">
            <button onclick="closeCardModal()" class="absolute top-4 right-4 w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-600 font-bold text-lg transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div id="modalContent">
                <!-- Dynamic Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-white border-t-4 border-slate-100 py-8 text-center text-sm font-semibold text-slate-400">
        <p>🌟 小學生快樂學習網 • 每天進步一點點！ 🌟</p>
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Data for celebratory popups (no long text, pure fun & badges)
        const modalData = {
            chinese: {
                title: "中文冒險王！",
                icon: "book-open",
                color: "bg-pink-500",
                badge: "🏆 獲得【漢字小達人】勳章！",
                emoji: "📚✨"
            },
            english: {
                title: "英文大冒險！",
                icon: "globe-2",
                color: "bg-blue-500",
                badge: "🏆 獲得【ABC發音王】勳章！",
                emoji: "🌟🎤"
            },
            math: {
                title: "數學金頭腦！",
                icon: "calculator",
                color: "bg-emerald-500",
                badge: "🏆 獲得【邏輯大天才】勳章！",
                emoji: "🔢🎯"
            },
            humanities: {
                title: "社會小博士！",
                icon: "landmark",
                color: "bg-orange-500",
                badge: "🏆 獲得【世界探險家】勳章！",
                emoji: "🗺️👑"
            },
            science: {
                title: "小小發明家！",
                icon: "flask-conical",
                color: "bg-cyan-500",
                badge: "🏆 獲得【科學實驗王】勳章！",
                emoji: "🧪🚀"
            },
            music: {
                title: "音樂小歌神！",
                icon: "music-2",
                color: "bg-purple-500",
                badge: "🏆 獲得【節奏小天王】勳章！",
                emoji: "🎵⭐"
            }
        };

        const modal = document.getElementById('funModal');
        const modalCard = document.getElementById('modalCard');
        const modalContent = document.getElementById('modalContent');

        function openCardModal(key) {
            const data = modalData[key];
            if (!data) return;

            modalContent.innerHTML = `
                <div class="text-6xl mb-4 animate-bounce">${data.emoji}</div>
                <div class="w-20 h-20 mx-auto rounded-3xl ${data.color} text-white flex items-center justify-center shadow-lg mb-4">
                    <i data-lucide="${data.icon}" class="w-10 h-10"></i>
                </div>
                <h3 class="text-3xl font-extrabold text-slate-800 mb-2">${data.title}</h3>
                <div class="px-4 py-3 rounded-2xl bg-yellow-50 border-2 border-yellow-200 text-yellow-800 font-bold text-sm mb-6 shadow-sm">
                    ${data.badge}
                </div>
                <button onclick="closeCardModal()" class="w-full py-3.5 rounded-2xl bg-slate-900 text-white font-bold text-base hover:bg-pink-500 transition-colors shadow-lg">
                    太棒了！繼續闖關 🎉
                </button>
            `;

            lucide.createIcons();
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-75');
            modalCard.classList.add('scale-100');
        }

        function closeCardModal() {
            modal.classList.add('opacity-0', 'pointer-events-none');
            modalCard.classList.remove('scale-100');
            modalCard.classList.add('scale-75');
        }

        function openRandomCard() {
            const keys = Object.keys(modalData);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            openCardModal(randomKey);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeCardModal();
            }
        });
    </script>
</body>
</html>
