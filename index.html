<!DOCTYPE html>
<html lang="zh-HK" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>默書小幫手 | Primary Dictation Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#f0f5ff',
                            100: '#e0ebff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', '"Helvetica Neue"', 'Arial', '"Noto Sans TC"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            min-height: 100vh;
            min-height: -webkit-fill-available;
            background-color: #fdfbf7;
        }

        .dark body {
            background-color: #0d0f17;
        }

        .classroom-bg-light {
            background-color: #fcf9f2;
            background-image: 
                radial-gradient(at 0% 0%, rgba(253, 230, 238, 0.6) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(220, 252, 231, 0.6) 0px, transparent 50%);
        }

        .dark .classroom-bg-light {
            background-color: #0f111a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(88, 28, 135, 0.3) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 78, 59, 0.3) 0px, transparent 50%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .dark .glass-card {
            background: rgba(23, 25, 35, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-hover:hover {
            transform: translateY(-3px) scale(1.02);
        }

        .card-hover:active {
            transform: translateY(0) scale(0.98);
        }
    </style>
</head>
<body class="classroom-bg-light text-slate-800 dark:text-slate-100 flex flex-col justify-start items-center p-3 sm:p-4 select-none relative overflow-x-hidden">

    <!-- Top-Left Stationery Decorative Graphics -->
    <svg class="absolute top-0 left-0 w-36 h-36 sm:w-56 sm:h-56 pointer-events-none opacity-80 z-0" viewBox="0 0 200 200" fill="none">
        <!-- Soft background blob -->
        <path d="M-20 -20 Q70 10 100 60 Q130 110 50 150 Q-20 180 -40 100 Z" fill="#FCE7F3" class="dark:fill-rose-950/30"/>
        <!-- Pencil 1 -->
        <g transform="translate(15, 20) rotate(45)">
            <rect x="0" y="0" width="12" height="50" rx="2" fill="#F97316"/>
            <polygon points="0,50 6,62 12,50" fill="#FDBA74"/>
            <polygon points="4,58 6,62 8,58" fill="#1E293B"/>
            <rect x="0" y="-8" width="12" height="8" rx="1" fill="#F43F5E"/>
        </g>
        <!-- Ruler -->
        <g transform="translate(60, 15) rotate(-20)">
            <rect x="0" y="0" width="16" height="70" rx="3" fill="#60A5FA" opacity="0.8"/>
            <line x1="0" y1="10" x2="6" y2="10" stroke="white" stroke-width="1.5"/>
            <line x1="0" y1="20" x2="10" y2="20" stroke="white" stroke-width="1.5"/>
            <line x1="0" y1="30" x2="6" y2="30" stroke="white" stroke-width="1.5"/>
            <line x1="0" y1="40" x2="10" y2="40" stroke="white" stroke-width="1.5"/>
            <line x1="0" y1="50" x2="6" y2="50" stroke="white" stroke-width="1.5"/>
            <line x1="0" y1="60" x2="10" y2="60" stroke="white" stroke-width="1.5"/>
        </g>
        <!-- Open Book -->
        <g transform="translate(10, 85) rotate(-10)">
            <rect x="0" y="0" width="22" height="28" rx="2" fill="#3B82F6"/>
            <rect x="22" y="0" width="22" height="28" rx="2" fill="#60A5FA"/>
            <rect x="3" y="3" width="16" height="22" fill="white" rx="1"/>
            <rect x="25" y="3" width="16" height="22" fill="white" rx="1"/>
            <line x1="6" y1="8" x2="15" y2="8" stroke="#94A3B8" stroke-width="1.5"/>
            <line x1="6" y1="13" x2="15" y2="13" stroke="#94A3B8" stroke-width="1.5"/>
            <line x1="28" y1="8" x2="37" y2="8" stroke="#94A3B8" stroke-width="1.5"/>
            <line x1="28" y1="13" x2="37" y2="13" stroke="#94A3B8" stroke-width="1.5"/>
        </g>
        <!-- Eraser -->
        <g transform="translate(85, 80) rotate(15)">
            <rect x="0" y="0" width="24" height="14" rx="3" fill="#A855F7"/>
            <rect x="12" y="0" width="12" height="14" rx="1" fill="#E2E8F0"/>
        </g>
    </svg>

    <!-- Bottom-Right Stationery Decorative Graphics -->
    <svg class="absolute bottom-0 right-0 w-40 h-40 sm:w-60 sm:h-60 pointer-events-none opacity-80 z-0" viewBox="0 0 200 200" fill="none">
        <!-- Soft background blob -->
        <path d="M220 220 L100 220 Q80 140 140 80 Q190 30 220 90 Z" fill="#DCFCE7" class="dark:fill-emerald-950/30"/>
        <!-- Notepad -->
        <g transform="translate(95, 100) rotate(-12)">
            <rect x="0" y="0" width="45" height="55" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
            <rect x="0" y="0" width="45" height="10" rx="2" fill="#10B981"/>
            <line x1="8" y1="18" x2="37" y2="18" stroke="#94A3B8" stroke-width="1.5"/>
            <line x1="8" y1="26" x2="37" y2="26" stroke="#94A3B8" stroke-width="1.5"/>
            <line x1="8" y1="34" x2="37" y2="34" stroke="#94A3B8" stroke-width="1.5"/>
            <line x1="8" y1="42" x2="28" y2="42" stroke="#94A3B8" stroke-width="1.5"/>
        </g>
        <!-- Set Square / Triangle Ruler -->
        <g transform="translate(130, 45) rotate(25)">
            <polygon points="0,50 50,50 50,0" fill="#FBBF24" opacity="0.85"/>
            <polygon points="10,42 40,42 40,12" fill="#FCF9F2" class="dark:fill-slate-900"/>
        </g>
        <!-- Pencil 2 -->
        <g transform="translate(70, 75) rotate(-55)">
            <rect x="0" y="0" width="10" height="60" rx="2" fill="#EAB308"/>
            <polygon points="0,60 5,72 10,60" fill="#FDE047"/>
            <polygon points="3,68 5,72 7,68" fill="#1E293B"/>
            <rect x="0" y="-8" width="10" height="8" rx="1" fill="#EC4899"/>
        </g>
    </svg>

    <div class="w-full max-w-xs sm:max-w-sm flex flex-col items-center z-10 relative">
        <!-- Top Navigation / Header Card -->
        <header class="w-full glass-card rounded-2xl px-4 py-2.5 sm:py-3 mb-2 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 shrink-0">
                    <i class="fa-solid fa-graduation-cap text-lg sm:text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight leading-none text-slate-900 dark:text-white">默書小幫手</h1>
                    <p class="text-xs font-black text-indigo-600 dark:text-indigo-400 tracking-wider uppercase mt-1">PRIMARY DICTATION HUB</p>
                </div>
            </div>

            <!-- Theme Switcher -->
            <button id="themeToggleBtn" onclick="toggleTheme()" class="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-slate-200/70 dark:bg-slate-800/80 hover:bg-slate-300 dark:hover:bg-slate-700 flex items-center justify-center transition-colors text-amber-500 dark:text-amber-400 shrink-0">
                <i class="fa-solid fa-sun text-sm dark:hidden"></i>
                <i class="fa-solid fa-moon text-sm hidden dark:block"></i>
            </button>
        </header>

        <!-- Section Title -->
        <div class="text-center my-1.5">
            <h2 class="text-base sm:text-lg font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 via-purple-600 to-teal-500 dark:from-indigo-400 dark:via-purple-300 dark:to-teal-300 tracking-wide">
                開啟智能聽寫之旅
            </h2>
        </div>

        <!-- 2x2 Grid Layout for 4 Subjects -->
        <main class="w-full grid grid-cols-2 gap-2.5 sm:gap-3 mt-1">
            
            <!-- 1. 中文科 (Chinese) -->
            <a href="https://tonyymlee.github.io/pdictation/chi/" class="block text-decoration-none w-full">
                <div class="glass-card card-hover rounded-2xl aspect-square p-2 flex flex-col items-center justify-center text-center shadow-md hover:shadow-lg hover:shadow-rose-500/10 dark:hover:shadow-rose-900/20 border-t-2 border-t-rose-400/80 dark:border-t-rose-500/80 cursor-pointer">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white shadow-md shadow-rose-500/30 mb-1">
                        <i class="fa-solid fa-brush text-lg sm:text-xl"></i>
                    </div>
                    <span class="text-xs font-black tracking-wider text-rose-600 dark:text-rose-400 uppercase bg-rose-50 dark:bg-rose-950/50 px-2 py-0.5 rounded-full border border-rose-200 dark:border-rose-800/50 mb-0.5">
                        Chinese
                    </span>
                    <h3 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white leading-tight">中文科</h3>
                </div>
            </a>

            <!-- 2. 英文科 (English) -->
            <a href="https://tonyymlee.github.io/pdictation/eng/" class="block text-decoration-none w-full">
                <div class="glass-card card-hover rounded-2xl aspect-square p-2 flex flex-col items-center justify-center text-center shadow-md hover:shadow-lg hover:shadow-indigo-500/10 dark:hover:shadow-indigo-900/20 border-t-2 border-t-indigo-400/80 dark:border-t-indigo-500/80 cursor-pointer">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/30 mb-1">
                        <span class="font-extrabold text-base sm:text-lg tracking-tighter">ABC</span>
                    </div>
                    <span class="text-xs font-black tracking-wider text-indigo-600 dark:text-indigo-400 uppercase bg-indigo-50 dark:bg-indigo-950/50 px-2 py-0.5 rounded-full border border-indigo-200 dark:border-indigo-800/50 mb-0.5">
                        English
                    </span>
                    <h3 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white leading-tight">英文科</h3>
                </div>
            </a>

            <!-- 3. 人文科 (Humanities) -->
            <a href="https://tonyymlee.github.io/pdictation/hum/" class="block text-decoration-none w-full">
                <div class="glass-card card-hover rounded-2xl aspect-square p-2 flex flex-col items-center justify-center text-center shadow-md hover:shadow-lg hover:shadow-amber-500/10 dark:hover:shadow-amber-900/20 border-t-2 border-t-amber-400/80 dark:border-t-amber-500/80 cursor-pointer">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-amber-500 to-orange-500 flex items-center justify-center text-white shadow-md shadow-amber-500/30 mb-1">
                        <i class="fa-solid fa-earth-asia text-lg sm:text-xl"></i>
                    </div>
                    <span class="text-xs font-black tracking-wider text-amber-600 dark:text-amber-400 uppercase bg-amber-50 dark:bg-amber-950/50 px-2 py-0.5 rounded-full border border-amber-200 dark:border-amber-800/50 mb-0.5">
                        Humanities
                    </span>
                    <h3 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white leading-tight">人文科</h3>
                </div>
            </a>

            <!-- 4. 科學科 (Science) -->
            <a href="https://tonyymlee.github.io/pdictation/sci/" class="block text-decoration-none w-full">
                <div class="glass-card card-hover rounded-2xl aspect-square p-2 flex flex-col items-center justify-center text-center shadow-md hover:shadow-lg hover:shadow-emerald-500/10 dark:hover:shadow-emerald-900/20 border-t-2 border-t-emerald-400/80 dark:border-t-emerald-500/80 cursor-pointer">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-500 flex items-center justify-center text-white shadow-md shadow-emerald-500/30 mb-1">
                        <i class="fa-solid fa-atom text-lg sm:text-xl"></i>
                    </div>
                    <span class="text-xs font-black tracking-wider text-emerald-600 dark:text-emerald-400 uppercase bg-emerald-50 dark:bg-emerald-950/50 px-2 py-0.5 rounded-full border border-emerald-200 dark:border-emerald-800/50 mb-0.5">
                        Science
                    </span>
                    <h3 class="text-xl sm:text-2xl font-black text-slate-900 dark:text-white leading-tight">科學科</h3>
                </div>
            </a>

        </main>
    </div>

    <script>
        function toggleTheme() {
            const htmlEl = document.documentElement;
            if (htmlEl.classList.contains('dark')) {
                htmlEl.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                htmlEl.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // Initialize theme preference from localStorage or OS settings
        (function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</body>
</html>
