    function switchTab(tabId, element) {
      currentTab = tabId;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (element) {
        element.classList.add('active');
      } else {
        const btn = document.getElementById('btn_' + tabId);
        if (btn) btn.classList.add('active');
      }
      renderTab();
      if (window.innerWidth <= 768) {
        closeSidebarMenu();
      }
    }

    function speakText(text, onEndCallback) {
      if (!synth) {
        if (onEndCallback) onEndCallback();
        return;
      }

      if (wakeUpTimeout) clearTimeout(wakeUpTimeout);

      const safeText = autoConvertCharacters(text.replace(/\s+/g, '')); 
      if (!safeText) {
        if (onEndCallback) onEndCallback();
        return;
      }

      const wasSpeaking = synth.speaking || synth.pending;
      if (wasSpeaking) {
        synth.cancel();
      }

      wakeUpTimeout = setTimeout(() => {
        const freshVoices = synth.getVoices() || [];
        if (freshVoices.length > 0) {
          availableVoices = freshVoices;
        }

        const utterance = new SpeechSynthesisUtterance(safeText);

        const voiceSelect = document.getElementById('voiceSelect');
        const selectedName = (voiceSelect && voiceSelect.value) ? voiceSelect.value : userSelectedVoiceName;
        let chosenVoice = null;
        
        if (selectedName) {
          chosenVoice = availableVoices.find(v => v.name === selectedName);
        }

        if (!chosenVoice) {
          if (currentLang === 'zh-TW') {
            chosenVoice = availableVoices.find(v => 
              v.lang === 'zh-TW' || v.lang === 'zh_TW' || (v.lang && v.lang.replace('_', '-').toLowerCase().includes('zh-tw')) || v.name.includes('國語') || v.name.includes('Taiwan') || v.name.includes('Mei-Jia')
            );
          } else if (currentLang === 'zh-CN') {
            chosenVoice = availableVoices.find(v => 
              v.lang === 'zh-CN' || v.lang === 'zh_CN' || (v.lang && v.lang.replace('_', '-').toLowerCase().includes('zh-cn')) || v.name.includes('普通話') || v.name.includes('Mandarin') || v.name.includes('Ting-Ting')
            );
          } else {
            chosenVoice = availableVoices.find(v => 
              v.lang === 'zh-HK' || v.lang === 'zh_HK' || (v.lang && v.lang.replace('_', '-').toLowerCase().includes('zh-hk')) || v.name.includes('廣東話') || v.name.includes('Cantonese') || v.name.includes('Sin-Ji') || (v.name && v.name.toLowerCase().includes('hong kong'))
            );
          }
        }

        if (chosenVoice) {
          utterance.voice = chosenVoice;
          if (chosenVoice.lang) utterance.lang = chosenVoice.lang;
        } else {
          utterance.lang = currentLang;
        }

        let activeRate = 0.82;
        const vocabSpeedSel = document.getElementById('vocabSpeedSelect');
        const dictSpeedSel = document.getElementById('dictationSpeedSelect');
        
        if ((currentTab === 'tab4' || currentTab === 'tab5') && dictSpeedSel) {
          activeRate = parseFloat(dictSpeedSel.value) || 0.7;
        } else if (vocabSpeedSel) {
          activeRate = parseFloat(vocabSpeedSel.value) || 0.82;
        }
        
        utterance.rate = activeRate;

        let callbackFired = false;
        const finishOnce = () => {
          if (callbackFired) return;
          callbackFired = true;
          clearTimeout(safetyTimeout);
          if (onEndCallback) onEndCallback();
        };

        const safetyTimeout = setTimeout(() => {
          if (synth && synth.speaking) {
            synth.cancel();
          }
          finishOnce();
        }, Math.max(safeText.length * 400 + 4000, 6000));

        utterance.onend = () => { 
          finishOnce();
        };

        utterance.onerror = (e) => { 
          if (e && (e.error === 'interrupted' || e.error === 'canceled')) {
            clearTimeout(safetyTimeout);
            return;
          }
          console.warn("SpeechSynthesis error:", e ? e.error : e);
          if (utterance.voice) {
            const fallbackUtterance = new SpeechSynthesisUtterance(safeText);
            fallbackUtterance.lang = currentLang;
            fallbackUtterance.rate = activeRate;
            fallbackUtterance.onend = finishOnce;
            fallbackUtterance.onerror = finishOnce;
            synth.speak(fallbackUtterance);
          } else {
            finishOnce();
          }
        };

        if (synth.paused) {
          synth.resume();
        }
        synth.speak(utterance);
      }, wasSpeaking ? 80 : 20); 
    }

    let manualPlayId = 0;

    function playSingleWord(word) {
      if (singlePlayTimeout1) clearTimeout(singlePlayTimeout1);
      if (singlePlayTimeout2) clearTimeout(singlePlayTimeout2);

      manualPlayId++;
      let currentId = manualPlayId;

      singlePlayTimeout1 = setTimeout(() => {
        if (currentId !== manualPlayId) return;
        speakText(word, () => {
          if (currentId !== manualPlayId) return;
          singlePlayTimeout2 = setTimeout(() => {
            if (currentId !== manualPlayId) return;
            speakText(word, null);
          }, 3000);
        });
      }, 200);
    }

    let dictationManualPlayId = 0;
    let manualDictationQueue = [];
    let isManualDictationPlaying = false;

    function playSingleDictationSentence(text, index) {
      manualDictationQueue.push({ text: text, index: index });
      if (!isManualDictationPlaying) {
        processManualDictationQueue();
      }
    }

    function processManualDictationQueue() {
      if (manualDictationQueue.length === 0) {
        isManualDictationPlaying = false;
        return;
      }
      isManualDictationPlaying = true;
      let item = manualDictationQueue.shift();

      if (item.index !== undefined) {
        highlightDictationCard(`dcard_${item.index}`);
      }

      dictationManualPlayId++;
      let currentId = dictationManualPlayId;

      singlePlayTimeout1 = setTimeout(() => {
        if (currentId !== dictationManualPlayId) { isManualDictationPlaying = false; return; }
        speakSentenceWithPunctuation(item.text, () => {
          if (currentId !== dictationManualPlayId) { isManualDictationPlaying = false; return; }
          singlePlayTimeout2 = setTimeout(() => {
            if (currentId !== dictationManualPlayId) { isManualDictationPlaying = false; return; }
            speakSentenceWithPunctuation(item.text, () => {
              if (currentId !== dictationManualPlayId) { isManualDictationPlaying = false; return; }
              isManualDictationPlaying = false;
              processManualDictationQueue();
            }, true, currentId);
          }, 3000);
        }, true, currentId);
      }, 200);
    }

    let reciteManualPlayId = 0;

    function playSingleReciteSentence(text, index) {
      if (wakeUpTimeout) clearTimeout(wakeUpTimeout);
      if (singlePlayTimeout1) clearTimeout(singlePlayTimeout1);
      if (singlePlayTimeout2) clearTimeout(singlePlayTimeout2);
      if (punctTimer) clearTimeout(punctTimer);
      clearInterval(timerInterval);

      if (index !== undefined) {
        highlightReciteCard(`rcard_${index}`);
      }

      reciteManualPlayId++;
      const currentId = reciteManualPlayId;

      // 讀該句第一次
      speakSentenceWithPunctuation(text, () => {
        if (currentId !== reciteManualPlayId) return;
        // 等待 3 秒
        singlePlayTimeout1 = setTimeout(() => {
          if (currentId !== reciteManualPlayId) return;
          // 讀該句第二次
          speakSentenceWithPunctuation(text, null, true, currentId);
        }, 3000);
      }, true, currentId);
    }

    function startTimer(seconds, onFinish) {
      clearInterval(timerInterval);
      totalTimerSeconds = Math.round(seconds);
      remainingSeconds = totalTimerSeconds;
      updateTimerDisplay();

      timerInterval = setInterval(() => {
        if (isPaused) return;
        remainingSeconds--;
        updateTimerDisplay();
        if (remainingSeconds <= 0) {
          clearInterval(timerInterval);
          if (onFinish) onFinish();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const pie = document.getElementById('timerPie');
      const digitalDisplay = document.getElementById('digitalTimerDisplay');

      if (remainingSeconds > 0 && totalTimerSeconds > 0) {
        const pct = (remainingSeconds / totalTimerSeconds) * 100;
        if (pie) pie.style.background = `conic-gradient(#3b82f6 ${pct}%, #e5e7eb ${pct}%)`;
        
        // 更新數位倒數時鐘 (MM:SS 格式)
        const mins = Math.floor(remainingSeconds / 60);
        const secs = remainingSeconds % 60;
        if (digitalDisplay) {
          digitalDisplay.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
      } else {
        if (pie) pie.style.background = `conic-gradient(#3b82f6 0%, #e5e7eb 0%)`;
        if (digitalDisplay) digitalDisplay.textContent = "0:00";
      }
    }

    function getCurrentTabTitle() {
      if (currentTab === 'tab1') return '課文詞語';
      if (currentTab === 'tab2') return '漢語拼音';
      if (currentTab === 'tab3') return '挑戰題';
      if (currentTab === 'tab4') return '聽寫課文段落';
      if (currentTab === 'tab5') return '背默課文段落';
      return '課文詞語';
    }

    function startAutoPlay(onlyHighlighted = false, fullRecite = false) {
      resetPlayback();
      isPlaying = true;
      isPaused = false;
      isReviewPhase = false;
      isOnlyHighlighted = onlyHighlighted;
      isFullReciteMode = fullRecite;
      
      updatePlayButtonsForTab();

      requestWakeLock();

      if (currentTab === 'tab5') {
        startRecitePlay(onlyHighlighted);
        return;
      }

      if (currentTab === 'tab4') {
        queue = buildDictationQueue().filter(q => q.type === 'sentence' || q.type === 'break');
      } else {
        let data = vocabWords;
        if (currentTab === 'tab2') data = pinyinVocabWords;
        if (currentTab === 'tab3') data = idiomWords;
        queue = data.filter(it => !it || typeof it !== 'object' || it.type !== 'subtitle');
      }

      if (onlyHighlighted) {
        if (!highlightedWords || highlightedWords.length === 0) {
          alert("沒有找到高亮/重點詞語。");
          resetPlayback();
          return;
        }
        queue = queue.filter(item => {
          const text = getItemText(item);
          if (!text) return false;
          return highlightedWords.some(hw => text.includes(hw));
        });
      }

      playIndex = 0;
      if (queue.length === 0) {
        releaseWakeLock();
        return;
      }

      const tabTitle = getCurrentTabTitle();
      speakText(`同學,我現在會讀${tabTitle}內容，請留心`, () => {
        if (!isPlaying) return;
        startTimer(8, () => {
          if (!isPlaying) return;
          if (currentTab === 'tab4') {
            playNextDictationStep();
          } else {
            playNextVocabStep();
          }
        });
      });
    }

    /* 獲取句子的前 2 個漢字 */
    function getFirstTwoChars(text) {
      let chars = Array.from(autoConvertCharacters(text.replace(/\s+/g, '')));
      let result = "";
      for (let ch of chars) {
        if (/[一-龥]/.test(ch)) {
          result += ch;
          if (result.length >= 2) break;
        }
      }
      return result || text.substring(0, 2);
    }

    /* 處理階段二的兩次回放邏輯 */
    function playRecitePromptSequence(item, sentenceOrderNum, onComplete) {
      const firstTwo = getFirstTwoChars(item.text);
      const total = countChineseChars(item.text);
      
      const secPerCharInput = document.getElementById('secPerCharInput');
      const secPerChar = secPerCharInput ? (parseFloat(secPerCharInput.value) || 2.3) : 2.3;
      const wordWriteTime = Math.max(1, Math.round(total * secPerChar));

      function doRound(roundNum, roundCb) {
        if (!isPlaying) return;
        if (isFullReciteMode) {
          // 全背默模式：不讀每句首兩字 -> 讀「第 n 句，全句」-> 等 1 秒 -> 讀「總字數」-> 等 (總字數 × 每字時間 + 3) 秒
          speakText(`第${sentenceOrderNum}句，全句`, () => {
            if (!isPlaying) return;
            startTimer(1, () => {
              if (!isPlaying) return;
              speakText(`${total}個字`, () => {
                if (!isPlaying) return;
                startTimer(wordWriteTime + 3, () => {
                  if (!isPlaying) return;
                  roundCb();
                });
              });
            });
          });
        } else {
          // 半背默模式：讀首2字 -> 等2秒 -> 全句 -> 等1秒 -> X個字 -> 等候 (總字數 × 每字時間)
          speakText(firstTwo, () => {
            if (!isPlaying) return;
            startTimer(2, () => {
              if (!isPlaying) return;
              speakText("全句", () => {
                if (!isPlaying) return;
                startTimer(1, () => {
                  if (!isPlaying) return;
                  speakText(`${total}個字`, () => {
                    if (!isPlaying) return;
                    startTimer(wordWriteTime, () => {
                      if (!isPlaying) return;
                      roundCb();
                    });
                  });
                });
              });
            });
          });
        }
      }

      doRound(1, () => {
        if (!isPlaying) return;
        doRound(2, () => {
          if (!isPlaying) return;
          onComplete();
        });
      });
    }

    function startRecitePlay(onlyHighlighted, startFromIndex = 0) {
      let fullQueue = buildReciteQueue();
      let sentenceItems = fullQueue.filter(q => q.type === 'sentence');

      if (onlyHighlighted) {
        if (!highlightedWords || highlightedWords.length === 0) {
          alert("沒有找到高亮/重點詞語。");
          resetPlayback();
          return;
        }
        sentenceItems = sentenceItems.filter(item => {
          const text = getItemText(item);
          return text && highlightedWords.some(hw => text.includes(hw));
        });
      }

      if (sentenceItems.length === 0) {
        releaseWakeLock();
        return;
      }

      // 自動模式第一階段開始時即顯示圓形時鐘
      updateTimerVisibilityForTab();

      const secPerCharInput = document.getElementById('secPerCharInput');
      const secPerChar = secPerCharInput ? (parseFloat(secPerCharInput.value) || 0.7) : 0.7;

      let totalWords = 0;
      sentenceItems.forEach(item => {
        totalWords += countChineseChars(item.text);
      });

      const totalSeconds = totalWords * secPerChar;
      const totalMinutes = (totalSeconds / 60).toFixed(1);
      const totalSentences = sentenceItems.length;

      let reciteIdx = 0;

      if (startFromIndex > 0) {
        let foundIdx = sentenceItems.findIndex(item => item.index === startFromIndex);
        if (foundIdx === -1) {
            let allItems = buildReciteQueue().filter(q => q.type === 'sentence');
            let clickedItem = allItems.find(q => q.index === startFromIndex);
            let originalQIndex = allItems.indexOf(clickedItem);
            foundIdx = sentenceItems.findIndex(qItem => allItems.indexOf(qItem) > originalQIndex);
        }
        if (foundIdx !== -1) {
          reciteIdx = foundIdx;
        } else {
          reciteIdx = sentenceItems.length;
        }
      }

      // 第一階段：正常完整朗讀每一句
      function speakNextReciteSentence() {
        if (!isPlaying) return;
        if (reciteIdx >= sentenceItems.length) {
          // 第一次讀完所有句子，切換至背默提示模式 (第二階段)
          isRecitePromptMode = true;
          const area = document.getElementById('contentArea');
          if (area) renderRecite(area); // 重新繪製 UI 為半背默(前2字+圓圈)或全背默(全圓圈)
          
          // 打開計時器面板 (圓形時鐘 + 數位計時器)
          updateTimerVisibilityForTab();

          const annText = `同學,現在請開始背默課文, 背默課文總共有 ${totalSentences}句,背默課文 時間是 ${totalMinutes}分鐘`;
          speakText(annText, () => {
            if (!isPlaying) return;
            
            // 開始第二階段：跳至新邏輯
            reciteIdx = 0;
            speakNextRecitePromptSentence();
          });
          return;
        }

        const item = sentenceItems[reciteIdx];
        highlightReciteCard(`rcard_${item.index}`);

        speakSentenceWithPunctuation(item.text, () => {
          if (!isPlaying) return;
          
          if (pendingJumpIndex !== null) {
              let foundIdx = sentenceItems.findIndex(i => i.index === pendingJumpIndex);
              if (foundIdx === -1) {
                  let allItems = buildReciteQueue().filter(q => q.type === 'sentence');
                  let clickedItem = allItems.find(q => q.index === pendingJumpIndex);
                  let originalQIndex = allItems.indexOf(clickedItem);
                  foundIdx = sentenceItems.findIndex(qItem => allItems.indexOf(qItem) > originalQIndex);
                  if (foundIdx === -1) foundIdx = sentenceItems.length;
              }
              reciteIdx = foundIdx;
              pendingJumpIndex = null;
              speakNextReciteSentence();
              return;
          }

          startTimer(3, () => {
            if (!isPlaying) return;
            reciteIdx++;
            speakNextReciteSentence();
          });
        });
      }

      // 第二階段：啟動 2 輪回放 (包含讀字數及中間延遲)
      function speakNextRecitePromptSentence() {
        if (!isPlaying) return;
        if (reciteIdx >= sentenceItems.length) {
          speakText("時間到了, 請檢查, 然後交默書, 謝謝", () => {
            resetPlayback(true); // 傳入 true 保留圓圈效果不重設 UI
          });
          return;
        }

        const item = sentenceItems[reciteIdx];
        highlightReciteCard(`rcard_${item.index}`);

        playRecitePromptSequence(item, reciteIdx + 1, () => {
          if (!isPlaying) return;

          // 處理手動點擊 (無縫銜接到下一句)
          if (pendingJumpIndex !== null) {
              let foundIdx = sentenceItems.findIndex(i => i.index === pendingJumpIndex);
              if (foundIdx === -1) {
                  let allItems = buildReciteQueue().filter(q => q.type === 'sentence');
                  let clickedItem = allItems.find(q => q.index === pendingJumpIndex);
                  let originalQIndex = allItems.indexOf(clickedItem);
                  foundIdx = sentenceItems.findIndex(qItem => allItems.indexOf(qItem) > originalQIndex);
                  if (foundIdx === -1) foundIdx = sentenceItems.length;
              }
              reciteIdx = foundIdx;
              pendingJumpIndex = null;
              speakNextRecitePromptSentence();
              return;
          }

          reciteIdx++;
          speakNextRecitePromptSentence();
        });
      }

      if (startFromIndex > 0) {
        speakNextReciteSentence();
      } else {
        startTimer(3, () => {
          if (!isPlaying) return;
          speakText("同學,現在是背默課文, 我會讀課文內容一次", () => {
            if (!isPlaying) return;
            startTimer(3, () => {
              if (!isPlaying) return;
              speakNextReciteSentence();
            });
          });
        });
      }
    }

    function playNextVocabStep() {
      if (!isPlaying) return;

      if (playIndex >= queue.length) {
        if (!isReviewPhase) {
          isReviewPhase = true;
          playIndex = 0;
          
          const tabTitle = getCurrentTabTitle();
          startTimer(5, () => {
            if (!isPlaying) return;
            speakText(`我已讀完全部${tabTitle}內容`, () => {
              if (!isPlaying) return;
              startTimer(3, () => {
                if (!isPlaying) return;
                speakText("現在讀全部內容一次，請留心", () => {
                  if (!isPlaying) return;
                  startTimer(5, () => {
                    if (!isPlaying) return;
                    playNextVocabStep();
                  });
                });
              });
            });
          });
        } else {
          speakText("讀完全部詞語，請檢查答案。", () => {
            resetPlayback();
          });
        }
        return;
      }

      let currentData = vocabWords;
      if (currentTab === 'tab2') currentData = pinyinVocabWords;
      if (currentTab === 'tab3') currentData = idiomWords;
      highlightVocabCard(currentData.indexOf(queue[playIndex]));
      const word = getItemText(queue[playIndex]);

      if (isReviewPhase) {
        speakText(word, () => {
          if (!isPlaying) return;
          startTimer(2, () => {
            if (!isPlaying) return;
            playIndex++;
            playNextVocabStep();
          });
        });
      } else {
        const charCount = countChineseChars(word) || word.replace(/\s+/g, '').length;
        const customDelay = (charCount < 3) ? 10 : 15;
        
        const vocabDelayInput = document.getElementById('vocabDelayInput');
        if (vocabDelayInput) {
          vocabDelayInput.value = customDelay;
        }

        speakText(word, () => {
          if (!isPlaying) return;
          startTimer(10, () => {
            if (!isPlaying) return;
            speakText(word, () => {
              if (!isPlaying) return;
              startTimer(customDelay, () => {
                if (!isPlaying) return;
                playIndex++;
                playNextVocabStep();
              });
            });
          });
        });
      }
    }

    function highlightVocabCard(idx) {
      document.querySelectorAll('.word-card').forEach(c => c.classList.remove('active-reading'));
      const card = document.getElementById(`card_${idx}`);
      if (card) {
        card.classList.add('active-reading');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function clickPlayVocab(idx) {
      let data = vocabWords;
      if (currentTab === 'tab2') data = pinyinVocabWords;
      if (currentTab === 'tab3') data = idiomWords;

      if (!data || !data[idx]) return;
      const item = data[idx];
      if (typeof item === 'object' && item !== null && item.type === 'subtitle') return;

      highlightVocabCard(idx);
      const wordText = getItemText(item);

      if (isPlaying) {
        if (wakeUpTimeout) clearTimeout(wakeUpTimeout);
        if (punctTimer) clearTimeout(punctTimer);
        clearInterval(timerInterval);
        if (synth) synth.cancel(); 
        
        queue = data.filter(it => !it || typeof it !== 'object' || it.type !== 'subtitle');
        
        if (isOnlyHighlighted) {
          queue = queue.filter(qItem => {
            const text = getItemText(qItem);
            return text && highlightedWords.some(hw => text.includes(hw));
          });
        }
        
        playIndex = queue.indexOf(item);
        
        if (playIndex === -1) {
          let allItems = data.filter(it => !it || typeof it !== 'object' || it.type !== 'subtitle');
          let clickedOriginalIndex = allItems.indexOf(item);
          playIndex = queue.findIndex(qItem => allItems.indexOf(qItem) > clickedOriginalIndex);
          if (playIndex === -1) playIndex = queue.length;
          
          speakText(wordText, () => {
            if (!isPlaying) return;
            startTimer(3, () => {
              if (!isPlaying) return;
              playNextVocabStep();
            });
          });
          return;
        }
        
        playNextVocabStep();
      } else {
        playSingleWord(wordText);
      }
    }

    function applyPendingDictationJump() {
        playIndex = queue.findIndex(q => q.index === pendingJumpIndex);
        if (playIndex === -1) {
            let allQueue = buildDictationQueue().filter(q => q.type === 'sentence' || q.type === 'break');
            let clickedItem = allQueue.find(q => q.index === pendingJumpIndex);
            let originalQIndex = allQueue.indexOf(clickedItem);
            playIndex = queue.findIndex(qItem => allQueue.indexOf(qItem) > originalQIndex);
            if (playIndex === -1) playIndex = queue.length;
        }
        pendingJumpIndex = null;
        playNextDictationStep();
    }

    function playNextDictationStep() {
      if (!isPlaying) return;

      if (playIndex >= queue.length) {
        if (!isReviewPhase) {
          isReviewPhase = true;
          playIndex = 0;
          
          const tabTitle = getCurrentTabTitle();
          startTimer(5, () => {
            if (!isPlaying) return;
            speakText(`我已讀完全部${tabTitle}內容`, () => {
              if (!isPlaying) return;
              startTimer(3, () => {
                if (!isPlaying) return;
                speakText("現在讀全部內容一次，請留心", () => {
                  if (!isPlaying) return;
                  startTimer(5, () => {
                    if (!isPlaying) return;
                    playNextDictationStep();
                  });
                });
              });
            });
          });
        } else {
          speakText("最後一次讀完全部課文，請不要離開座位，並用2分鐘檢查答案，然後交卷，謝謝。", () => {
            resetPlayback();
          });
        }
        return;
      }

      const item = queue[playIndex];

      if (item.type === 'break') {
        highlightDictationCard('break_card');
        startTimer(2, () => {
          if (!isPlaying) return;
          speakText("下一個自然段", () => {
            if (!isPlaying) return;
            startTimer(2, () => {
              if (!isPlaying) return;
              playIndex++;
              playNextDictationStep();
            });
          });
        });
        return;
      }

      highlightDictationCard(`dcard_${item.index}`);

      if (isReviewPhase) {
        speakSentenceWithPunctuation(item.text, () => {
          if (!isPlaying) return;
          if (pendingJumpIndex !== null) { applyPendingDictationJump(); return; }
          
          startTimer(2, () => {
            if (!isPlaying) return;
            playIndex++;
            playNextDictationStep();
          });
        });
      } else {
        const secPerCharInput = document.getElementById('secPerCharInput');
        const secPerChar = secPerCharInput ? (parseFloat(secPerCharInput.value) || 2.3) : 2.3;
        const charCount = countChineseChars(item.text) || 1;
        
        const xSec = Math.round(charCount * secPerChar);
        const secondPauseSec = xSec + xSec + 5;

        speakSentenceWithPunctuation(item.text, () => {
          if (!isPlaying) return;
          if (pendingJumpIndex !== null) { applyPendingDictationJump(); return; }

          startTimer(xSec, () => {
            if (!isPlaying) return;
            
            speakSentenceWithPunctuation(item.text, () => {
              if (!isPlaying) return;
              if (pendingJumpIndex !== null) { applyPendingDictationJump(); return; }

              startTimer(secondPauseSec, () => {
                if (!isPlaying) return;
                playIndex++;
                playNextDictationStep();
              });
            });
          });
        });
      }
    }

    function speakSentenceWithPunctuation(text, onComplete, isManual = false, playId = null) {
      isSpeakingSentence = true;
      let tokens = [];
      let cur = "";

      for (let char of text) {
        if (punctMap[char]) {
          if (cur) tokens.push({ type: 'text', val: cur });
          tokens.push({ type: 'punct', val: punctMap[char] });
          cur = "";
        } else {
          cur += char;
        }
      }
      if (cur) tokens.push({ type: 'text', val: cur });

      let tokenIdx = 0;
      function step() {
        const activeManualId = (currentTab === 'tab5') ? reciteManualPlayId : dictationManualPlayId;
        if (isManual && playId !== null && playId !== activeManualId) {
            isSpeakingSentence = false;
            return;
        }
        if (!isPlaying && !isManual && onComplete) {
            isSpeakingSentence = false;
            return;
        }

        if (tokenIdx >= tokens.length) {
          isSpeakingSentence = false;
          if (onComplete) onComplete();
          return;
        }
        const tok = tokens[tokenIdx];
        tokenIdx++;

        if (tok.type === 'text') {
          speakText(tok.val, step);
        } else if (tok.type === 'punct') {
          if (punctTimer) clearTimeout(punctTimer);
          punctTimer = setTimeout(() => {
            if (isManual) {
              setTimeout(() => {
                const curManualId = (currentTab === 'tab5') ? reciteManualPlayId : dictationManualPlayId;
                if (playId !== null && playId !== curManualId) return;
                speakText(tok.val, () => {
                  const curManualIdAfter = (currentTab === 'tab5') ? reciteManualPlayId : dictationManualPlayId;
                  if (playId !== null && playId !== curManualIdAfter) return;
                  setTimeout(step, 2000);
                });
              }, 2000);
            } else {
              startTimer(2, () => {
                if (!isPlaying) return;
                speakText(tok.val, () => {
                  if (!isPlaying) return;
                  startTimer(2, step);
                });
              });
            }
          }, 0);
        }
      }
      step();
    }

    function highlightDictationCard(cardId) {
      document.querySelectorAll('.dictation-row, .paragraph-break').forEach(c => c.classList.remove('active-reading'));
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.add('active-reading');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function highlightReciteCard(cardId) {
      document.querySelectorAll('.dictation-row, .paragraph-break').forEach(c => c.classList.remove('active-reading'));
      const card = document.getElementById(cardId);
      if (card) {
        card.classList.add('active-reading');
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }

    function clickPlayDictation(index) {
      let dictQueue = buildDictationQueue().filter(q => q.type === 'sentence' || q.type === 'break');

      if (isPlaying) {
        highlightDictationCard(`dcard_${index}`); 
        if (isOnlyHighlighted) {
          dictQueue = dictQueue.filter(item => {
            const text = getItemText(item);
            return text && highlightedWords.some(hw => text.includes(hw));
          });
        }
        queue = dictQueue;

        if (isSpeakingSentence) {
            pendingJumpIndex = index;
        } else {
            if (wakeUpTimeout) clearTimeout(wakeUpTimeout);
            if (punctTimer) clearTimeout(punctTimer);
            clearInterval(timerInterval);
            if (synth) synth.cancel(); 

            pendingJumpIndex = index;
            applyPendingDictationJump();
        }
      } else {
        const allQueue = buildDictationQueue().filter(q => q.type === 'sentence' || q.type === 'break');
        const item = allQueue.find(q => q.index === index);
        if (item) {
          highlightDictationCard(`dcard_${index}`); 
          playSingleDictationSentence(item.text, index);
        }
      }
    }

    function clickPlayRecite(index) {
      if (isPlaying) {
          highlightReciteCard(`rcard_${index}`);
          // 如果處於背默發聲模式中或正發音，我們僅設定跳轉 index 讓當下進度結束後無縫銜接
          if (isSpeakingSentence || isRecitePromptMode) {
              pendingJumpIndex = index;
          } else {
              if (wakeUpTimeout) clearTimeout(wakeUpTimeout);
              if (punctTimer) clearTimeout(punctTimer);
              clearInterval(timerInterval);
              if (synth) synth.cancel();
              
              pendingJumpIndex = null;
              startRecitePlay(isOnlyHighlighted, index);
          }
          return;
      }

      // 自動模式未啟動（或已結束）時，不重新啟動自動模式；保留圓圈顯示，讀該句一次、等3秒、再讀第二次
      const allQueue = buildReciteQueue().filter(q => q.type === 'sentence');
      const item = allQueue.find(q => q.index === index);
      if (item) {
        playSingleReciteSentence(item.text, index);
      }
    }

    function togglePauseResume() {
      if (!isPlaying || !synth) return;
      const btn = document.getElementById('pauseResumeBtn');
      isPaused = !isPaused;
      
      if (isPaused) {
        synth.pause();
        if (btn) {
          btn.innerHTML = playIconSvg;
          btn.classList.add('is-paused');
          btn.title = '繼續播放';
        }
      } else {
        synth.resume();
        if (btn) {
          btn.innerHTML = pauseIconSvg;
          btn.classList.remove('is-paused');
          btn.title = '暫停播放';
        }
      }
    }

    // 加入 keepCircles 控制變量
    function resetPlayback(keepCircles = false) {
      isPlaying = false;
      isPaused = false;
      isReviewPhase = false;
      isOnlyHighlighted = false;
      
      if (!keepCircles) {
        isRecitePromptMode = false;
        isFullReciteMode = false;
      }
      
      playIndex = 0;
      isSpeakingSentence = false;
      pendingJumpIndex = null;

      manualDictationQueue = [];
      isManualDictationPlaying = false;
      if (typeof dictationManualPlayId !== 'undefined') dictationManualPlayId++;
      if (typeof reciteManualPlayId !== 'undefined') reciteManualPlayId++;

      updatePlayButtonsForTab();

      releaseWakeLock();

      const btn = document.getElementById('pauseResumeBtn');
      if (btn) {
        btn.innerHTML = pauseIconSvg;
        btn.classList.remove('is-paused');
        btn.title = '暫停播放';
      }

      if (wakeUpTimeout) clearTimeout(wakeUpTimeout);
      if (singlePlayTimeout1) clearTimeout(singlePlayTimeout1);
      if (singlePlayTimeout2) clearTimeout(singlePlayTimeout2);
      if (punctTimer) clearTimeout(punctTimer);

      clearInterval(timerInterval);
      remainingSeconds = 0;
      totalTimerSeconds = 0;
      updateTimerDisplay();

      // 前四個單元保持顯示圓形時鐘；背默模式 (tab5) 隱藏整個計時器面板
      updateTimerVisibilityForTab();

      if (synth) synth.cancel();
      document.querySelectorAll('.active-reading').forEach(c => c.classList.remove('active-reading'));

      // 重設 UI
      const area = document.getElementById('contentArea');
      if (area && currentTab === 'tab5') {
        renderRecite(area);
      }
    }

    let availableVoices = [];
    let userSelectedVoiceName = "";

    function populateVoices() {
      if (!window.speechSynthesis) return;
      const voiceSelect = document.getElementById('voiceSelect');
      if (!voiceSelect) return;

      let voices = window.speechSynthesis.getVoices();
      if (voices && voices.length > 0) {
        availableVoices = voices;
      }

      const currentVal = voiceSelect.value || userSelectedVoiceName;
      const chineseOnly = document.getElementById('chineseVoicesOnly') ? document.getElementById('chineseVoicesOnly').checked : false;

      voiceSelect.innerHTML = '';

      const defaultOpt = document.createElement('option');
      defaultOpt.value = "";
      defaultOpt.textContent = "預設語音 (系統)";
      voiceSelect.appendChild(defaultOpt);

      if (availableVoices.length > 0) {
        let filteredVoices = availableVoices;
        if (chineseOnly) {
          filteredVoices = availableVoices.filter(v => {
            const l = (v.lang || '').toLowerCase();
            const n = (v.name || '').toLowerCase();
            return l.includes('zh') || l.includes('cn') || l.includes('hk') || l.includes('tw') || n.includes('chinese') || n.includes('cantonese') || n.includes('mandarin');
          });
        }

        if (filteredVoices.length === 0) {
          filteredVoices = availableVoices;
        }

        filteredVoices.forEach((voice) => {
          const opt = document.createElement('option');
          let langLabel = voice.lang ? ` (${voice.lang})` : '';
          opt.textContent = `${voice.name}${langLabel}`;
          opt.value = voice.name;
          voiceSelect.appendChild(opt);
        });
      }

      if (currentVal && Array.from(voiceSelect.options).some(o => o.value === currentVal)) {
        voiceSelect.value = currentVal;
      } else {
        voiceSelect.value = "";
      }
    }

    async function loadSystemFonts() {
      const fontSelect = document.getElementById('fontSelect');
      if (!fontSelect) return;

      if (!('queryLocalFonts' in window)) {
        alert("您的瀏覽器不支援 Local Font Access API (建議使用最新版 Google Chrome 或 Edge 桌面版)。");
        return;
      }

      try {
        const permissionStatus = await navigator.permissions.query({ name: 'local-fonts' });
        if (permissionStatus.state === 'denied') {
          alert("字型存取權限已被拒絕，請在瀏覽器設定中允許。");
          return;
        }

        const fonts = await window.queryLocalFonts();
        const fontFamilies = new Set();
        
        fonts.forEach(font => {
          if (font.family) {
            fontFamilies.add(font.family);
          }
        });

        const sortedFamilies = Array.from(fontFamilies).sort();

        const currentVal = fontSelect.value;
        fontSelect.innerHTML = `
          <option value="LXGW WenKai TC, serif">霞鶩文楷 (預設)</option>
          <option value="Free HK Kai 4700, DFKai-SB, BiauKai, 標楷體, KaiTi, STKaiti, serif">Free HK Kai 4700</option>
          <option value="DFKai-SB, BiauKai, 標楷體, KaiTi, STKaiti, serif">標楷體</option>
          <option value="SimHei, Microsoft JhengHei, sans-serif">黑體 (微軟正黑)</option>
          <option value="SimSun, MingLiu, serif">宋體 / 明體</option>
          <option value="YouYuan, Rounded Mplus 1c, sans-serif">圓體</option>
        `;

        const optGroup = document.createElement('optgroup');
        optGroup.label = "🖥️ 本機已安裝字型 (" + sortedFamilies.length + ")";
        
        sortedFamilies.forEach(family => {
          if (!['霞鶩文楷', 'Free HK Kai 4700', '標楷體', '黑體', '宋體', '圓體'].includes(family)) {
            const opt = document.createElement('option');
            opt.value = `"${family}", serif`;
            opt.textContent = family;
            optGroup.appendChild(opt);
          }
        });

        fontSelect.appendChild(optGroup);
        if (currentVal) fontSelect.value = currentVal;
        alert(`成功掃描並載錄 ${sortedFamilies.length} 款本機字型！`);
      } catch (err) {
        console.error("Failed to load local fonts:", err);
        alert("無法讀取本機字型，請確認瀏覽器權限。");
      }
    }

    function onFontChange() {
      const fontSelect = document.getElementById('fontSelect');
      if (!fontSelect) return;
      const selectedFont = fontSelect.value;

      let fontStack = `"${selectedFont}", sans-serif`;
      if (selectedFont === 'DFKai-SB') {
        fontStack = '"DFKai-SB", "BiauKai", "標楷體", "KaiTi", "STKaiti", "Apple LiSung", serif';
      } else if (selectedFont === 'LXGW WenKai TC') {
        fontStack = '"LXGW WenKai TC", "LXGW WenKai", "Microsoft JhengHei", sans-serif';
      } else if (selectedFont === 'Iansui') {
        fontStack = '"Iansui", cursive, serif';
      } else if (selectedFont === 'Noto Serif HK') {
        fontStack = '"Noto Serif HK", "Noto Serif TC", serif';
      } else if (selectedFont === 'Noto Sans HK') {
        fontStack = '"Noto Sans HK", "Noto Sans TC", sans-serif';
      } else if (selectedFont === 'SimHei') {
        fontStack = '"Microsoft JhengHei", "PingFang HK", "Heiti TC", "SimHei", sans-serif';
      } else if (selectedFont === 'SimSun') {
        fontStack = '"SimSun", "PMingLiU", "Apple Myungjo", serif';
      } else if (selectedFont === 'YouYuan') {
        fontStack = '"YouYuan", "Rounded Mplus 1c", "Hiragino Maru Gothic Pro", sans-serif';
      } else if (selectedFont === 'Free HK Kai 4700') {
        fontStack = '"Free HK Kai 4700", "BiauKai", "DFKai-SB", "標楷體", serif';
      } else {
        fontStack = `"${selectedFont}", serif`;
      }

      document.documentElement.style.setProperty('--font-family', fontStack);
      document.body.style.fontFamily = fontStack;
      
      let dynStyle = document.getElementById('dynamicFontOverride');
      if (!dynStyle) {
        dynStyle = document.createElement('style');
        dynStyle.id = 'dynamicFontOverride';
        document.head.appendChild(dynStyle);
      }
      dynStyle.textContent = `
        body, *, .word-text, .sentence-text, .word-card, .dictation-row, button, input, select, textarea, h1, h2, h3, span {
          font-family: ${fontStack} !important;
        }
        .pinyin-text, .sentence-pinyin {
          font-family: var(--pinyin-font-family) !important;
        }
      `;
    }

    function onVoiceChange() {
      const voiceSelect = document.getElementById('voiceSelect');
      if (!voiceSelect) return;
      userSelectedVoiceName = voiceSelect.value;

      if (synth) {
        synth.cancel();
      }

      if (userSelectedVoiceName) {
        setTimeout(() => {
          speakText("語音已切換", null);
        }, 150);
      }
    }

    function onSpeedChange() {
      if (synth) {
        synth.cancel();
      }
    }

    function initVoiceList() {
      populateVoices();
      if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {
          populateVoices();
        };
        setTimeout(populateVoices, 100);
        setTimeout(populateVoices, 500);
        setTimeout(populateVoices, 1200);
        setTimeout(populateVoices, 2500);
      }
    }

    function autoInitApp() {
      const embeddedDataTag = document.getElementById('embeddedPinyinData');
      if (embeddedDataTag && embeddedDataTag.textContent) {
        try {
          embeddedPinyinCache = JSON.parse(embeddedDataTag.textContent);
        } catch (e) {
          console.error("Failed to parse embedded pinyin cache:", e);
        }
      }

      if (synth) {
        initVoiceList();
      }
      
      const editor = document.getElementById('rawTextEditor');
      if (editor) {
        const textContent = editor.textContent || "";
        const valueContent = editor.value || "";
        const finalContent = textContent.trim().length > 0 ? textContent : valueContent;
        
        if (finalContent.trim().length > 0) {
          const converted = autoConvertCharacters(finalContent);
          editor.value = converted;
          parseAndApplyFullText(converted);
        }
      }

      const mainContent = document.getElementById('mainContent');
      if (mainContent) {
        mainContent.addEventListener('scroll', () => {
          const toolbars = document.querySelectorAll('.toolbar-card');
          if (mainContent.scrollTop > 0) {
            toolbars.forEach(tb => tb.classList.add('is-scrolled'));
          } else {
            toolbars.forEach(tb => tb.classList.remove('is-scrolled'));
          }
        });
      }

      switchTab('tab1', document.getElementById('btn_tab1'));
      checkAndResolveSameNamePdf();
    }

    document.addEventListener('DOMContentLoaded', autoInitApp);
    window.onload = autoInitApp;
  </script>
