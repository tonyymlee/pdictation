  <style>
    :root {
      --bg-color: #f8fafc;

      left: 0;
      right: 0;

      letter-spacing: 1.5px;
      margin-bottom: 12px;
      font-family: var(--font-sans);
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .header-sub-title {
      color: var(--bright-lime-green);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.8px;
      line-height: 1.5;
    }

    .rainbow-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 50px;
      max-width: 1100px;
      margin: 9mm auto 60px;
      padding: 0 20px;
    }

    .rainbow-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }

    .rainbow-card:hover {
      transform: translateY(-6px);
    }

    .wheel-wrapper {
      position: relative;
      width: 270px;
      height: 270px;
    }

    .rainbow-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .cell-slice {
      cursor: pointer;
      transition: opacity 0.4s ease, transform 0.25s ease;
      stroke: #ffffff;
      stroke-width: 2.5px;
      opacity: 0; /* Initially invisible until link check completes */
    }

    .cell-slice:hover {
      filter: drop-shadow(0px 0px 6px rgba(0,0,0,0.25));
    }

    .center-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 110px;
      background: white;
      border-radius: 50%;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
      transition: background-color 0.3s ease;
    }

    .wheel-wrapper:not(.disabled-wheel):has(.rainbow-svg:hover) .center-circle {
      background-color: #49fcfc;
    }

    .center-circle .level-text {
      font-family: var(--font-en);
      font-size: 2.2rem;
      font-weight: 900;
      color: #15803d;
      line-height: 1;
    }

    .center-circle .sub-text {
      font-size: 0.85rem;
      font-weight: 700;
      color: #475569;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    .cell-text {
      font-family: var(--font-en);
      font-size: 15px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      user-select: none;
      opacity: 0; /* Initially invisible */
      transition: opacity 0.4s ease;
    }

    .eval-text {
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 900;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
      user-select: none;
      letter-spacing: 0.5px;
      opacity: 0; /* Initially invisible */
      transition: opacity 0.4s ease;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      max-width: 800px;
      margin: 0 auto;
    }

    .home-btn {
      position: absolute;
      top: 3mm;
      left: 12px;
      color: #ffffff;
      font-size: 1.4rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #8570ed;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
      transition: all 0.2s ease;
      z-index: 20;
    }

    .home-btn:hover {
      background: #725be5;
      transform: scale(1.06);
    }
  </style>
</head>
<body>

  <header class="dark-green-header">
    <a href="https://tonyymlee.github.io/pdictation/" class="home-btn" title="返回首頁">
      <i class="fa-solid fa-house"></i>
    </a>
    <div class="header-main-title">開心小學 中國語文科<br>默書自主學習平台</div>
    <div class="header-sub-title">請點選相應的單元或評估環形區域，<br>即可進入專屬線上默書自主溫習網頁。</div>
  </header>

  <div class="rainbow-container">
    <div class="rainbow-card">
      <div class="wheel-wrapper">
        <svg class="rainbow-svg" viewBox="0 0 200 200" id="svg-p4"></svg>
        <div class="center-circle">
          <span class="level-text">P4</span>
          <span class="sub-text">四年級</span>
        </div>
      </div>
    </div>

    <div class="rainbow-card">
      <div class="wheel-wrapper">
        <svg class="rainbow-svg" viewBox="0 0 200 200" id="svg-p5"></svg>
        <div class="center-circle">
          <span class="level-text">P5</span>
          <span class="sub-text">五年級</span>
        </div>
      </div>
    </div>

    <div class="rainbow-card">
      <div class="wheel-wrapper">
        <svg class="rainbow-svg" viewBox="0 0 200 200" id="svg-p6"></svg>
        <div class="center-circle">
          <span class="level-text">P6</span>
          <span class="sub-text">六年級</span>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 開心小學 中國語文科網頁 | Primary Chinese Language Dictation Learning Portal</p>
  </footer>

  <script>
    const cellData = [
      { id: "1", name: "單元一", desc: "第一單元：核心詞組特訓與語境詞義運用", isEval: false },
      { id: "2", name: "單元二", desc: "第二單元：語段默寫與常用句型結構鞏固", isEval: false },
      { id: "3", name: "單元三", desc: "第三單元：精選篇章默寫與語感提昇特訓", isEval: false },
      { id: "評1", name: "階段評估一", desc: "第一學期 第一次階段性默書綜合評估", isEval: true },
      { id: "4", name: "單元四", desc: "第四單元：高頻錯字診斷與進階詞組積累", isEval: false },
      { id: "5", name: "單元五", desc: "第五單元：成語典故默寫與寫作詞彙拓展", isEval: false },
      { id: "6", name: "單元六", desc: "第六單元：修辭手法句式與語文基礎特訓", isEval: false },
      { id: "評2", name: "階段評估二", desc: "第一學期 總結性默書學業評估", isEval: true },
      { id: "7", name: "單元七", desc: "第七單元：古詩文名句默寫與文言字詞理解", isEval: false },
      { id: "8", name: "單元八", desc: "第八單元：課外高階詞彙拓展與閱讀延伸", isEval: false },
      { id: "9", name: "單元九", desc: "第九單元：綜合錯別字校正與篇章演練", isEval: false },
      { id: "評3", name: "階段評估三", desc: "第二學期 呈分試總複習學業評估", isEval: true }
    ];

    const rainbowColors = [
      "#EAB308", "#F97316", "#EA580C", "#E65100",
      "#DC2626", "#7E22CE", "#4338CA", "#1D4ED8",
      "#0284C7", "#059669", "#15803D", "#84CC16"
    ];

    function polarToCartesian(centerX, centerY, radius, angleInDegrees) {
      const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
      return {
        x: centerX + (radius * Math.cos(angleInRadians)),
        y: centerY + (radius * Math.sin(angleInRadians))
      };
    }

    function describeArc(x, y, innerRadius, outerRadius, startAngle, endAngle) {
      const startOuter = polarToCartesian(x, y, outerRadius, endAngle);
      const endOuter = polarToCartesian(x, y, outerRadius, startAngle);
      const startInner = polarToCartesian(x, y, innerRadius, endAngle);
      const endInner = polarToCartesian(x, y, innerRadius, startAngle);
      const arcSweep = endAngle - startAngle <= 180 ? "0" : "1";
      return [
        "M", startOuter.x, startOuter.y,
        "A", outerRadius, outerRadius, 0, arcSweep, 0, endOuter.x, endOuter.y,
        "L", endInner.x, endInner.y,
        "A", innerRadius, innerRadius, 0, arcSweep, 1, startInner.x, startInner.y,
        "Z"
      ].join(" ");
    }

    function buildRainbowWheel(levelPrefix, svgElementId) {
      const svg = document.getElementById(svgElementId);
      const cx = 100, cy = 100, innerRadius = 62, outerRadius = 96;
      const totalSlices = cellData.length;
      const angleStep = 360 / totalSlices;

      cellData.forEach((cell, index) => {
        const startAngle = index * angleStep;
        const endAngle = (index + 1) * angleStep;
        const targetFilename = `${levelPrefix}_D${cell.id}.html`;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", describeArc(cx, cy, innerRadius, outerRadius, startAngle, endAngle));
        path.setAttribute("fill", rainbowColors[index]);
        path.setAttribute("class", "cell-slice");

        const textGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const midAngle = startAngle + (angleStep / 2);
        const textRadius = (innerRadius + outerRadius) / 2;
        const pos = polarToCartesian(cx, cy, textRadius, midAngle);

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", pos.x);
        text.setAttribute("y", pos.y);
        text.setAttribute("transform", `rotate(${midAngle}, ${pos.x}, ${pos.y})`);
        text.setAttribute("class", cell.isEval ? "eval-text" : "cell-text");
        text.textContent = cell.name;
        textGroup.appendChild(text);

        svg.appendChild(path);
        svg.appendChild(textGroup);

        // Asynchronous link validation (checks 404 / exists)
        fetch(targetFilename, { method: 'HEAD' })
          .then(response => {
            if (response.ok) {
              path.style.opacity = "1"; // Fade in valid slice
              text.style.opacity = "1"; // Fade in valid text
              path.addEventListener("click", () => {
                window.location.href = targetFilename;
              });
              path.style.cursor = "pointer";
            } else {
              // 404 Not Found or other error
              path.setAttribute("fill", "#9CA3AF"); // Grey out
              path.style.opacity = "0.6";
              text.style.opacity = "0.8";
              path.style.cursor = "not-allowed";
            }
          })
          .catch(() => {
            // Network error / local file protocol restriction fallback
            path.style.opacity = "1";
            text.style.opacity = "1";
            path.addEventListener("click", () => {
              window.location.href = targetFilename;
            });
            path.style.cursor = "pointer";
          });
      });
    }

    window.addEventListener("DOMContentLoaded", () => {
      buildRainbowWheel("P4", "svg-p4");
      buildRainbowWheel("P5", "svg-p5");
      buildRainbowWheel("P6", "svg-p6");
    });
  </script>
</body>
</html>
